<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Margins</title>

  <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%}
    body{
      background:#f3f3f3;
      font-family:"Poppins",sans-serif;
      overflow-y:auto;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 18px);
    }
    .card{
      width:100%;
      max-width:420px;
      background:#fff;
      border:1px solid #e8e8e8;
      border-radius:16px;
      box-shadow:0 8px 24px rgba(0,0,0,.06);
      padding:18px;
    }
    .logo{display:flex;justify-content:center;padding:6px 0 12px}
    .logo img{width:min(320px,86vw);height:auto;display:block}

    .section{display:flex;flex-direction:column;gap:8px;padding:10px 0}
    .section + .section{border-top:1px solid #f1f1f1}
    .section-title{
      font-size:11px;
      font-weight:800;
      color:#111;
      opacity:.55;
      letter-spacing:.03em;
      text-transform:uppercase;
      margin-left:2px;
    }

    .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

    .input{
      display:flex;
      align-items:center;
      border:1px solid #dcdcdc;
      border-radius:12px;
      overflow:hidden;
      background:#fff;
      position:relative;
    }
    .prefix,.suffix{
      font-size:13px;
      font-weight:900;
      color:#111;
      background:#f4f4f4;
      padding:10px 10px;
      white-space:nowrap;
      display:flex;
      align-items:center;
      gap:6px;
      min-height:44px;
    }
    .prefix{border-right:1px solid #e2e2e2}
    .suffix{
      border-left:1px solid #e2e2e2;
      justify-content:flex-end;
      min-width:86px;
    }

    .suffix-wrap{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      line-height:1.05;
    }
    .suffix-label{
      font-size:13px;
      font-weight:900;
      color:#111;
    }
    .suffix-old{
      display:none;
      font-size:10px;
      font-weight:800;
      color:#8d8d8d;
      text-decoration:line-through;
      margin-top:2px;
    }
    .suffix.has-old .suffix-old{display:block}

    input[type="number"]{
      width:100%;
      border:none;
      outline:none;
      padding:12px 12px;
      font-size:16px;
      font-weight:900;
      color:#111;
      background:#fff;
      min-width:0;
    }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
    input[type="number"]{ -moz-appearance:textfield; appearance:textfield; }

    .summary{
      margin-top:12px;
      padding:14px;
      border-radius:14px;
      background:#007bff;
      color:#fff;
    }
    .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .pill{
      border-radius:14px;
      padding:12px;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.22);
    }
    .pill .k{
      font-size:12px;
      opacity:.95;
      font-weight:900;
      margin-bottom:8px;
      letter-spacing:.02em;
    }
    .biginput{display:flex;align-items:baseline;gap:6px}
    .bigprefix{font-size:18px;font-weight:900;opacity:.95;line-height:1}
    .biginput input{
      border:none;outline:none;background:transparent;color:#fff;
      font-size:26px;font-weight:900;width:100%;padding:0;line-height:1.05;
    }
    .biginput input::placeholder{color:rgba(255,255,255,.75)}
  </style>
</head>

<body>
  <div class="card">
    <div class="logo">
      <img src="logo.png" alt="Logo">
    </div>

    <!-- Purchase -->
    <div class="section">
      <div class="section-title">Purchase</div>
      <div class="row2">
        <div class="input">
          <div class="prefix">€</div>
          <input type="number" id="purchaseEx" min="0" inputmode="decimal" />
          <div class="suffix">
            <div class="suffix-wrap">
              <span class="suffix-label">Excl.</span>
            </div>
          </div>
        </div>
        <div class="input">
          <div class="prefix">€</div>
          <input type="number" id="purchaseIn" min="0" inputmode="decimal" />
          <div class="suffix">
            <div class="suffix-wrap">
              <span class="suffix-label">Incl.</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Selling -->
    <div class="section">
      <div class="section-title">Selling</div>
      <div class="row2">
        <div class="input">
          <div class="prefix">€</div>
          <input type="number" id="sellIn" min="0" inputmode="decimal" />
          <div class="suffix" id="sellInSuffix">
            <div class="suffix-wrap">
              <span class="suffix-label">Incl.</span>
              <span class="suffix-old" id="sellInOld"></span>
            </div>
          </div>
        </div>
        <div class="input">
          <div class="prefix">€</div>
          <input type="number" id="sellEx" min="0" inputmode="decimal" />
          <div class="suffix" id="sellExSuffix">
            <div class="suffix-wrap">
              <span class="suffix-label">Excl.</span>
              <span class="suffix-old" id="sellExOld"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Discount -->
    <div class="section">
      <div class="section-title">Discount</div>
      <div class="row2">
        <div class="input">
          <div class="prefix">%</div>
          <input type="number" id="discPct" min="0" max="99" inputmode="decimal" />
        </div>
        <div class="input">
          <div class="prefix">€</div>
          <input type="number" id="discEur" min="0" inputmode="decimal" />
        </div>
      </div>
    </div>

    <!-- Margin -->
    <div class="summary">
      <div class="summary-grid">
        <div class="pill">
          <div class="k">Margin</div>
          <div class="biginput">
            <span class="bigprefix">%</span>
            <input type="number" id="mPct" min="0" max="99" inputmode="decimal" />
          </div>
        </div>
        <div class="pill">
          <div class="k">Margin</div>
          <div class="biginput">
            <span class="bigprefix">€</span>
            <input type="number" id="mEur" min="0" inputmode="decimal" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const VAT = 1.21;
    const el = (id) => document.getElementById(id);

    const raw = (id) => el(id).value;
    const hasVal = (id) => raw(id).trim() !== "";

    const num = (id) => {
      const v = parseFloat(el(id).value);
      return Number.isFinite(v) ? v : null;
    };

    const floorOrEmpty = (v) => (v === null || v === "" || Number.isNaN(v)) ? "" : Math.floor(v);
    const ceilOrEmpty = (v) => (v === null || v === "" || Number.isNaN(v)) ? "" : Math.ceil(v);

    const setVal = (id, v) => { el(id).value = floorOrEmpty(v); };
    const setPrefillPurchase = (id, v) => { el(id).value = ceilOrEmpty(v); };
    const setPrefillOther = (id, v) => { el(id).value = floorOrEmpty(v); };

    const clear = (ids) => ids.forEach(i => el(i).value = "");
    const clamp = (n,a,b) => Math.min(Math.max(n,a),b);

    let updating = false;
    let lastEdited = null;
    let driver = null; // purchase | sell | marginPct | marginEur

    function fmtSmallEuro(v){
      if (v === null || Number.isNaN(v)) return "";
      return "€" + Math.floor(Math.max(v,0));
    }

    function syncPair(aId, bId, mult){
      if (lastEdited === aId && raw(aId).trim() === "") { clear([bId]); return; }
      if (lastEdited === bId && raw(bId).trim() === "") { clear([aId]); return; }

      const a = num(aId);
      const b = num(bId);

      if (lastEdited === bId && b !== null) setVal(aId, b * mult);
      else if (lastEdited === aId && a !== null) setVal(bId, a / mult);
      else {
        if (a === null && b !== null) setVal(aId, b * mult);
        if (b === null && a !== null) setVal(bId, a / mult);
      }
    }

    function getBaseSellEx(){
      const sellEx = num("sellEx");
      if (sellEx !== null) return sellEx;
      const sellIn = num("sellIn");
      if (sellIn !== null) return sellIn / VAT;
      return null;
    }

    function getBaseSellIn(){
      const sellIn = num("sellIn");
      if (sellIn !== null) return sellIn;
      const sellEx = num("sellEx");
      if (sellEx !== null) return sellEx * VAT;
      return null;
    }

    function discountActive(){
      return hasVal("discPct") || hasVal("discEur");
    }

    function syncDiscountFields(){
      const sellIn = getBaseSellIn();

      if (["discPct","discEur"].includes(lastEdited) && !hasVal(lastEdited)){
        clear(["discPct","discEur"]);
        return;
      }

      if (sellIn === null || sellIn <= 0){
        if (["discPct","discEur"].includes(lastEdited)) clear(["discPct","discEur"]);
        return;
      }

      if (lastEdited === "discPct"){
        const p = num("discPct");
        if (p === null) return;
        const pct = clamp(p, 0, 99);
        const discEur = sellIn * (pct / 100);
        setVal("discPct", pct);
        setVal("discEur", discEur);
      }

      if (lastEdited === "discEur"){
        const e = num("discEur");
        if (e === null) return;
        const eur = Math.max(e, 0);
        const pct = sellIn > 0 ? (eur / sellIn) * 100 : 0;
        setVal("discEur", eur);
        setVal("discPct", clamp(pct, 0, 99));
      }
    }

    function getFinalSellIn(){
      const base = getBaseSellIn();
      if (base === null) return null;

      if (hasVal("discPct")){
        const p = num("discPct");
        if (p !== null) return Math.max(base * (1 - clamp(p,0,99)/100), 0);
      }

      if (hasVal("discEur")){
        const e = num("discEur");
        if (e !== null) return Math.max(base - Math.max(e,0), 0);
      }

      return base;
    }

    function getFinalSellEx(){
      const finalIn = getFinalSellIn();
      return finalIn === null ? null : finalIn / VAT;
    }

    function updateSellingCompareUI(){
      const sellInSuffix = el("sellInSuffix");
      const sellExSuffix = el("sellExSuffix");
      const sellInOld = el("sellInOld");
      const sellExOld = el("sellExOld");

      const baseIn = getBaseSellIn();
      const finalIn = getFinalSellIn();
      const baseEx = getBaseSellEx();
      const finalEx = getFinalSellEx();

      const showIn = discountActive() && baseIn !== null && finalIn !== null && Math.floor(baseIn) !== Math.floor(finalIn);
      const showEx = discountActive() && baseEx !== null && finalEx !== null && Math.floor(baseEx) !== Math.floor(finalEx);

      if (showIn){
        sellInSuffix.classList.add("has-old");
        sellInOld.textContent = fmtSmallEuro(baseIn);
        setVal("sellIn", finalIn);
      } else {
        sellInSuffix.classList.remove("has-old");
        sellInOld.textContent = "";
      }

      if (showEx){
        sellExSuffix.classList.add("has-old");
        sellExOld.textContent = fmtSmallEuro(baseEx);
        setVal("sellEx", finalEx);
      } else {
        sellExSuffix.classList.remove("has-old");
        sellExOld.textContent = "";
      }
    }

    function clearSellingCompareUI(){
      el("sellInSuffix").classList.remove("has-old");
      el("sellExSuffix").classList.remove("has-old");
      el("sellInOld").textContent = "";
      el("sellExOld").textContent = "";
    }

    function setBaseSellFromValues(ex, source){
      if (ex === null || !(ex >= 0)) return;
      updating = true;
      setVal("sellEx", ex);
      setVal("sellIn", ex * VAT);
      updating = false;
      if (source) driver = source;
    }

    function applyMarginDriver(){
      const purchaseEx = num("purchaseEx");
      if (purchaseEx === null || !(purchaseEx >= 0)) return;

      if (driver === "marginPct" || lastEdited === "mPct"){
        const p = num("mPct");
        if (p === null) return;
        const pct = clamp(p,0,99);
        const sellEx = purchaseEx / (1 - pct/100);
        const marginEur = sellEx - purchaseEx;
        setBaseSellFromValues(sellEx, "marginPct");
        updating = true;
        setVal("mPct", pct);
        setVal("mEur", marginEur);
        updating = false;
      }

      if (driver === "marginEur" || lastEdited === "mEur"){
        const e = num("mEur");
        if (e === null) return;
        const marginEur = Math.max(e,0);
        const sellEx = purchaseEx + marginEur;
        const pct = sellEx > 0 ? (marginEur / sellEx) * 100 : 0;
        setBaseSellFromValues(sellEx, "marginEur");
        updating = true;
        setVal("mEur", marginEur);
        setVal("mPct", clamp(pct,0,99));
        updating = false;
      }
    }

    function computeMarginFromCurrentFinalPrice(){
      const purchaseEx = num("purchaseEx");
      const finalSellEx = getFinalSellEx();

      if (purchaseEx === null || finalSellEx === null || !(finalSellEx > 0)){
        clear(["mPct","mEur"]);
        return;
      }

      const marginEur = finalSellEx - purchaseEx;
      const pct = (marginEur / finalSellEx) * 100;

      updating = true;
      setVal("mPct", clamp(pct,0,99));
      setVal("mEur", marginEur);
      updating = false;
    }

    function updateDriver(){
      if (lastEdited === "purchaseEx" || lastEdited === "purchaseIn") {
        if (driver === "marginPct" || driver === "marginEur") return;
        if (getBaseSellEx() !== null) driver = "sell";
        else driver = "purchase";
      }

      if (lastEdited === "sellIn" || lastEdited === "sellEx") {
        driver = "sell";
      }

      if (lastEdited === "mPct") {
        driver = hasVal("mPct") ? "marginPct" : null;
      }

      if (lastEdited === "mEur") {
        driver = hasVal("mEur") ? "marginEur" : null;
      }

      if (lastEdited === "discPct" || lastEdited === "discEur") {
        if (!driver) driver = "sell";
      }
    }

    function restoreBaseSellingBeforeDiscountSensitiveEdits(){
      if (!discountActive()) return;

      if (["sellIn","sellEx","mPct","mEur","purchaseEx","purchaseIn"].includes(lastEdited)) {
        const oldInText = el("sellInOld").textContent.replace(/[^\d.-]/g, "");
        const oldExText = el("sellExOld").textContent.replace(/[^\d.-]/g, "");
        const oldIn = oldInText ? parseFloat(oldInText) : null;
        const oldEx = oldExText ? parseFloat(oldExText) : null;

        if (oldIn !== null && oldEx !== null) {
          updating = true;
          setVal("sellIn", oldIn);
          setVal("sellEx", oldEx);
          updating = false;
        }
      }
    }

    function recalc(){
      if (updating) return;
      updating = true;

      restoreBaseSellingBeforeDiscountSensitiveEdits();

      syncPair("purchaseIn","purchaseEx", VAT);
      syncPair("sellIn","sellEx", VAT);

      updating = false;

      updateDriver();

      if (driver === "marginPct" || driver === "marginEur" || lastEdited === "mPct" || lastEdited === "mEur"){
        applyMarginDriver();
      }

      syncDiscountFields();

      if (discountActive()){
        const baseEx = getBaseSellEx();
        const baseIn = getBaseSellIn();

        if (baseEx !== null && baseIn !== null){
          const finalIn = getFinalSellIn();
          const finalEx = getFinalSellEx();

          updating = true;
          setVal("sellIn", finalIn);
          setVal("sellEx", finalEx);
          updating = false;

          el("sellInOld").textContent = fmtSmallEuro(baseIn);
          el("sellExOld").textContent = fmtSmallEuro(baseEx);

          if (Math.floor(baseIn) !== Math.floor(finalIn)) el("sellInSuffix").classList.add("has-old");
          else el("sellInSuffix").classList.remove("has-old");

          if (Math.floor(baseEx) !== Math.floor(finalEx)) el("sellExSuffix").classList.add("has-old");
          else el("sellExSuffix").classList.remove("has-old");
        }
      } else {
        clearSellingCompareUI();
      }

      computeMarginFromCurrentFinalPrice();
    }

    function bind(id){
      const input = el(id);
      if (!input) return;

      input.addEventListener("input", () => {
        lastEdited = id;
        recalc();
      });

      input.addEventListener("focus", () => {
        setTimeout(() => { try { input.select(); } catch(e){} }, 0);
      });
    }

    function setPrices({ purchaseEx=null, purchaseIn=null, sellIn=null, sellEx=null, discPct=null, discEur=null } = {}) {
      updating = true;

      if (purchaseEx !== null) setPrefillPurchase("purchaseEx", purchaseEx);
      if (purchaseIn !== null) setPrefillPurchase("purchaseIn", purchaseIn);

      if (sellIn !== null) setPrefillOther("sellIn", sellIn);
      if (sellEx !== null) setPrefillOther("sellEx", sellEx);

      if (discPct !== null) el("discPct").value = floorOrEmpty(discPct);
      if (discEur !== null) el("discEur").value = floorOrEmpty(discEur);

      driver = null;
      lastEdited = null;

      syncPair("purchaseIn","purchaseEx", VAT);
      syncPair("sellIn","sellEx", VAT);

      updating = false;

      lastEdited = "sellIn";
      recalc();
    }

    function loadFromQueryString() {
      const qs = new URLSearchParams(window.location.search);

      const p  = qs.get("p");
      const pi = qs.get("pi");
      const s  = qs.get("s");
      const se = qs.get("se");
      const dp = qs.get("dp");
      const de = qs.get("de");

      const obj = {};
      if (p  !== null && p  !== "") obj.purchaseEx = parseFloat(p);
      if (pi !== null && pi !== "") obj.purchaseIn = parseFloat(pi);
      if (s  !== null && s  !== "") obj.sellIn     = parseFloat(s);
      if (se !== null && se !== "") obj.sellEx     = parseFloat(se);
      if (dp !== null && dp !== "") obj.discPct    = parseFloat(dp);
      if (de !== null && de !== "") obj.discEur    = parseFloat(de);

      if (Object.keys(obj).length) setPrices(obj);
    }

    function saveToLocal() {
      const data = {
        purchaseEx: raw("purchaseEx"),
        purchaseIn: raw("purchaseIn"),
        sellIn: raw("sellIn"),
        sellEx: raw("sellEx"),
        discPct: raw("discPct"),
        discEur: raw("discEur")
      };
      localStorage.setItem("margins_tool_state_v1", JSON.stringify(data));
    }

    function loadFromLocal() {
      try {
        const s = localStorage.getItem("margins_tool_state_v1");
        if (!s) return false;
        const data = JSON.parse(s);

        const any = ["purchaseEx","purchaseIn","sellIn","sellEx","discPct","discEur"]
          .some(k => (data[k] ?? "").toString().trim() !== "");
        if (!any) return false;

        const obj = {
          purchaseEx: data.purchaseEx !== "" ? parseFloat(data.purchaseEx) : null,
          purchaseIn: data.purchaseIn !== "" ? parseFloat(data.purchaseIn) : null,
          sellIn:     data.sellIn     !== "" ? parseFloat(data.sellIn)     : null,
          sellEx:     data.sellEx     !== "" ? parseFloat(data.sellEx)     : null,
          discPct:    data.discPct    !== "" ? parseFloat(data.discPct)    : null,
          discEur:    data.discEur    !== "" ? parseFloat(data.discEur)    : null
        };

        setPrices(obj);
        return true;
      } catch {
        return false;
      }
    }

    function attachAutosave() {
      ["purchaseEx","purchaseIn","sellIn","sellEx","discPct","discEur","mPct","mEur"].forEach(id => {
        el(id).addEventListener("input", () => {
          clearTimeout(window.__saveT);
          window.__saveT = setTimeout(saveToLocal, 150);
        });
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      ["purchaseEx","purchaseIn","sellIn","sellEx","discPct","discEur","mPct","mEur"].forEach(bind);

      const loadedLocal = loadFromLocal();
      loadFromQueryString();
      attachAutosave();

      if (!loadedLocal && !window.location.search) recalc();

      window.setPrices = setPrices;
    });
  </script>
</body>
</html>
