<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Margins</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%}

    body{
      background:#f3f3f3;
      font-family:"Poppins",sans-serif;
      overflow-y:auto;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 18px);
    }

    .card{
      width:100%;
      max-width:420px;
      background:#fff;
      border:1px solid #e8e8e8;
      border-radius:16px;
      box-shadow:0 8px 24px rgba(0,0,0,.06);
      padding:18px;
    }

    .logo{display:flex;justify-content:center;padding:6px 0 12px}
    .logo img{width:min(320px,86vw);height:auto;display:block}

    .section{display:flex;flex-direction:column;gap:8px;padding:10px 0}
    .section + .section{border-top:1px solid #f1f1f1}

    .section-title{
      font-size:12px;
      font-weight:800;
      color:#111;
      opacity:1;
      letter-spacing:.03em;
      text-transform:uppercase;
      margin-left:2px;
    }

    .row-2,
    .price-stack,
    .summary-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .field,
    .biginput,
    .input{
      border:1px solid #d8d8d8;
      border-radius:14px;
      background:#fff;
    }

    .field{
      display:flex;
      flex-direction:column;
      overflow:hidden;
      min-height:60px;
      position:relative;
      transition:border-color .18s ease, box-shadow .18s ease, opacity .18s ease;
    }

    .field.main{
      border:2px solid #007bff;
      box-shadow:0 0 0 3px rgba(0,123,255,.08);
    }

    .field.hidden{display:none !important}

    .field-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      width:100%;
      background:#fff;
      padding:6px 12px 10px;
      gap:2px;
      min-height:60px;
    }

    .value-wrap{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      justify-content:center;
      flex:1;
      min-width:0;
      gap:0;
    }

    .field-note,
    .discount-label{
      font-size:10px;
      font-weight:900;
      color:#111;
      opacity:1;
      line-height:1;
      text-transform:uppercase;
      letter-spacing:.03em;
    }

    .field-note{margin-top:-3px}
    .discount-label{padding-left:2px}

    .affix,
    .bigprefix{
      font-size:12px;
      font-weight:900;
      color:inherit;
      opacity:1;
      line-height:1;
    }

    .affix{
      min-width:10px;
      padding-top:4px;
      text-align:center;
      flex:0 0 10px;
    }

    .field input[type="number"],
    .field input[type="text"],
    .input input,
    .biginput input{
      width:100%;
      min-width:0;
      border:none;
      outline:none;
      font-weight:900;
      line-height:1;
      font-variant-numeric:tabular-nums;
      font-family:"Poppins",sans-serif;
    }

    .field input[type="number"],
    .field input[type="text"]{
      padding:0;
      font-size:24px;
      color:#111;
      background:#fff;
      text-align:left;
    }

    .input input{
      padding:8px 0;
      font-size:16px;
      color:#111;
      background:#fff;
      text-align:left;
    }

    .biginput input{
      background:transparent;
      color:#fff;
      font-size:24px;
      padding:0;
      text-align:left;
    }

    .field input::placeholder,
    .biginput input::placeholder,
    .input input::placeholder{color:#b4b4b4}

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
    input[type="number"]{ -moz-appearance:textfield; appearance:textfield; }

    .price-meta{
      position:absolute;
      right:10px;
      top:50%;
      transform:translateY(-50%);
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:6px;
      font-variant-numeric:tabular-nums;
      min-height:18px;
      visibility:hidden;
      opacity:0;
      transition:opacity .18s ease;
      pointer-events:none;
      max-width:46%;
    }

    .price-meta.show{
      visibility:visible;
      opacity:1;
    }

    .meta-current{display:none}

    .meta-discounted{
      display:flex;
      align-items:baseline;
      gap:2px;
      line-height:1;
      white-space:nowrap;
      color:#007bff;
      font-size:22px;
      font-weight:900;
    }

    .money-symbol{font-size:12px;font-weight:900;line-height:1;color:inherit}
    .money-value{font-size:1em;line-height:1}

    .discount-shell{display:none}
    .discount-shell.show{display:block}

    .discount-bar{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
      padding:8px;
      border:1px solid #d8d8d8;
      border-radius:14px;
      background:#fff;
      margin-bottom:8px;
    }

    .discount-row{
      display:grid;
      grid-template-columns:70px 1fr 90px;
      gap:8px;
      align-items:center;
    }

    .input{
      display:flex;
      align-items:center;
      min-height:40px;
      overflow:hidden;
      padding:0 10px;
      gap:6px;
    }

    .summary{margin-top:12px}

    .biginput{
      background:#007bff;
      color:#fff;
      border:none;
      box-shadow:0 4px 12px rgba(0,123,255,.2);
      padding:10px 12px;
      display:flex;
      align-items:baseline;
      gap:6px;
      min-height:52px;
    }

    .toolbar{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .discount-toggle,
    .icon-btn{
      width:42px;
      height:42px;
      border:none;
      border-radius:999px;
      background:#f4f4f4;
      color:#666;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      flex:0 0 42px;
      transition:all .18s ease;
      border:1px solid #e3e3e3;
      font-family:"Poppins",sans-serif;
    }

    .discount-toggle{ font-size:16px; font-weight:900; }
    .discount-toggle:hover,.icon-btn:hover{ background:#ededed; color:#111; }
    .discount-toggle:active,.icon-btn:active{ transform:scale(.96) }
    .discount-toggle.active,.discount-toggle.has-value{ background:#eef5ff; color:#007bff; border-color:#d7e7ff; }

    .mode-switch{
      display:grid;
      grid-template-columns:1fr 1fr;
      background:#eef5ff;
      border:1px solid #d7e7ff;
      border-radius:999px;
      padding:4px;
      gap:4px;
      flex:1;
    }

    .mode-btn{
      appearance:none;
      border:none;
      background:transparent;
      color:#4b5b73;
      font-family:"Poppins",sans-serif;
      font-size:14px;
      font-weight:800;
      padding:10px 14px;
      border-radius:999px;
      cursor:pointer;
      transition:all .18s ease;
    }

    .mode-btn.active{ background:#007bff; color:#fff; box-shadow:0 4px 12px rgba(0,123,255,.18); }
    .icon-btn svg{ width:18px; height:18px; display:block; }
  </style>
</head>
<body>

<div class="card">

  <div class="section">
    <div class="section-title">PURCHASE</div>
    <div class="grid-2">
      <div class="field main">
        <div class="row"><span class="affix">€</span><input placeholder="0"></div>
        <div class="note">EXCL.</div>
        <div class="price-meta">120</div>
      </div>
      <div class="field">
        <div class="row"><span class="affix">€</span><input placeholder="0"></div>
        <div class="note">INCL.</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">SELLING</div>
    <div class="grid-2">
      <div class="field main">
        <div class="row"><span class="affix">€</span><input placeholder="0"></div>
        <div class="note">INCL.</div>
      </div>
      <div class="field">
        <div class="row"><span class="affix">€</span><input placeholder="0"></div>
        <div class="note">EXCL.</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">DISCOUNT</div>
    <div class="discount-bar">

      <div class="discount-row">
        <div class="discount-label">PURCHASE</div>
        <input placeholder="0">
        <div class="switch">
          <button class="active">%</button>
          <button>€</button>
        </div>
      </div>

      <div class="discount-row">
        <div class="discount-label">SELLING</div>
        <input placeholder="0">
        <div class="switch">
          <button class="active">%</button>
          <button>€</button>
        </div>
      </div>

    </div>
  </div>

  <div class="section">
    <div class="section-title">MARGIN</div>
    <div class="margin-grid">
      <div class="margin-field">
        <span>%</span>
        <input placeholder="0">
      </div>
      <div class="margin-field">
        <span>€</span>
        <input placeholder="0">
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn">%</button>
    <button class="btn">↺</button>
  </div>

</div>

</body>
</html>
