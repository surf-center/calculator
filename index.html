<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Margins</title>

  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Margins">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%}

    body{
      background:#f3f3f3;
      font-family:"Poppins",sans-serif;
      overflow-y:auto;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 18px);
    }

    .card{
      width:100%;
      max-width:420px;
      background:#fff;
      border:1px solid #e8e8e8;
      border-radius:16px;
      box-shadow:0 8px 24px rgba(0,0,0,.06);
      padding:18px;
    }

    .logo{display:flex;justify-content:center;padding:6px 0 12px}
    .logo img{width:min(320px,86vw);height:auto;display:block}

    .section{display:flex;flex-direction:column;gap:8px;padding:10px 0}
    .section + .section{border-top:1px solid #f1f1f1}

    .section-title{
      font-size:12px;
      font-weight:800;
      color:#111;
      letter-spacing:.03em;
      text-transform:uppercase;
      margin-left:2px;
    }

    .row-2,
    .price-stack{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .field{
      display:flex;
      flex-direction:column;
      border:1px solid #d8d8d8;
      border-radius:14px;
      background:#fff;
      overflow:hidden;
      min-height:60px;
      position:relative;
      transition:border-color .18s ease, box-shadow .18s ease, opacity .18s ease;
    }

    .field.main{
      border:2px solid #007bff;
      box-shadow:0 0 0 3px rgba(0,123,255,.08);
    }

    .field.hidden{display:none !important}

    /* Bij korting: oorspronkelijke prijs doorstrepen */
    .field.discounted input[type="number"]{
      text-decoration:line-through;
      text-decoration-thickness:2px;
    }

    .field-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      width:100%;
      background:#fff;
      padding:6px 12px 10px;
      gap:2px;
      min-height:60px;
    }

    .value-wrap{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      justify-content:center;
      flex:1;
      min-width:0;
      gap:0;
    }

    .field-note{
      font-size:10px;
      font-weight:900;
      color:#111;
      line-height:1;
      text-transform:uppercase;
      letter-spacing:.03em;
      margin-top:-3px;
    }

    .affix{
      font-size:12px;
      font-weight:900;
      color:#111;
      min-width:10px;
      line-height:1;
      padding-top:4px;
      text-align:center;
      flex:0 0 10px;
    }

    .field input[type="number"],
    .field input[type="text"]{
      width:100%;
      min-width:0;
      border:none;
      outline:none;
      padding:0;
      font-size:24px;
      font-weight:900;
      color:#111;
      background:#fff;
      line-height:1;
      text-align:left;
      font-variant-numeric:tabular-nums;
      letter-spacing:-0.03em;
      font-family:"Poppins",sans-serif;
    }

    .field input::placeholder,
    .biginput input::placeholder,
    .discount-input::placeholder{color:#b4b4b4}

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
    input[type="number"]{ -moz-appearance:textfield; appearance:textfield; }

    .price-meta{
      position:absolute;
      right:10px;
      top:50%;
      transform:translateY(-50%);
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:6px;
      font-variant-numeric:tabular-nums;
      min-height:18px;
      visibility:hidden;
      opacity:0;
      transition:opacity .18s ease;
      pointer-events:none;
      max-width:46%;
    }

    .price-meta.show{
      visibility:visible;
      opacity:1;
    }

    .meta-current{
      display:none;
    }

    .meta-discounted{
      display:flex;
      align-items:baseline;
      gap:2px;
      line-height:1;
      white-space:nowrap;
      letter-spacing:-0.02em;
      color:#007bff;
      font-size:22px;
      font-weight:900;
    }

    .money-symbol,
    .bigprefix{
      font-size:12px;
      font-weight:900;
      line-height:1;
      color:inherit;
    }

    .money-value{font-size:1em;line-height:1}

    .discount-shell{display:none}
    .discount-shell .section-title{margin-bottom:8px}
    .discount-shell.show{display:block}

    .discount-card{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
      padding:10px;
      border:1px solid #d8d8d8;
      border-radius:14px;
      background:#fafafa;
      margin-bottom:8px;
    }

    .discount-row{
      display:grid;
      grid-template-columns:78px 1fr;
      gap:10px;
      align-items:start;
    }

    .discount-label{
      font-size:10px;
      font-weight:900;
      color:#111;
      text-transform:uppercase;
      letter-spacing:.03em;
      padding-left:2px;
      padding-top:12px;
    }

    .discount-control{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .discount-input{
      width:100%;
      min-width:0;
      border:1px solid #d8d8d8;
      outline:none;
      border-radius:14px;
      background:#fff;
      min-height:46px;
      padding:0 14px;
      font-size:18px;
      font-weight:900;
      color:#111;
      line-height:1;
      font-variant-numeric:tabular-nums;
      font-family:"Poppins",sans-serif;
      transition:border-color .18s ease, box-shadow .18s ease;
    }

    .discount-input:focus{
      border-color:#007bff;
      box-shadow:0 0 0 3px rgba(0,123,255,.08);
    }

    .discount-toggle{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:4px;
      padding:4px;
      border:1px solid #d8d8d8;
      border-radius:14px;
      background:#fff;
    }

    .discount-toggle button{
      appearance:none;
      border:none;
      background:transparent;
      color:#4b5b73;
      font-family:"Poppins",sans-serif;
      font-size:14px;
      font-weight:800;
      padding:10px 12px;
      border-radius:10px;
      cursor:pointer;
      transition:all .18s ease;
    }

    .discount-toggle button.active{
      background:#007bff;
      color:#fff;
      box-shadow:0 4px 12px rgba(0,123,255,.18);
    }

    .discount-hidden{display:none !important}

    /* Kortingsblok: label boven het veld; veld en %/EUR-knop naast elkaar */
    .discount-card{border-radius:16px;padding:12px;gap:14px;background:#f4f5f7;border-color:#f4f5f7}
    .discount-row{grid-template-columns:1fr;gap:6px}
    .discount-label{padding:0 0 0 2px;font-size:11px;letter-spacing:.06em}
    .discount-control{flex-direction:row;align-items:stretch;gap:8px}
    .discount-input{flex:1;font-size:20px;min-height:48px;border-color:#e3e5e8}
    .discount-toggle{flex:0 0 112px;align-items:stretch}
    .discount-toggle button{padding:0 8px;font-size:15px}
    @media (max-width:520px){
      .discount-input{font-size:22px;min-height:52px}
    }

    .summary{
      margin-top:0;
      padding:14px;
      border-radius:14px;
      background:#007bff;
      color:#fff;
    }

    .summary-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .pill{
      border-radius:14px;
      padding:12px;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.22);
    }

    .biginput{
      display:flex;
      align-items:baseline;
      gap:6px;
    }

    .biginput input{
      border:none;
      outline:none;
      background:transparent;
      color:#fff;
      font-size:24px;
      font-weight:900;
      width:100%;
      padding:0;
      line-height:1.05;
      text-align:left;
      letter-spacing:-0.03em;
      font-family:"Poppins",sans-serif;
    }

    .toolbar{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .toolbar-toggle,
    .icon-btn{
      width:42px;
      height:42px;
      border:none;
      border-radius:999px;
      background:#f4f4f4;
      color:#666;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      flex:0 0 42px;
      transition:all .18s ease;
      border:1px solid #e3e3e3;
      font-family:"Poppins",sans-serif;
    }

    .toolbar-toggle{
      font-size:16px;
      font-weight:900;
    }

    .toolbar-toggle:hover,.icon-btn:hover{ background:#ededed; color:#111; }
    .toolbar-toggle:active,.icon-btn:active{ transform:scale(.96) }
    .toolbar-toggle.active,.toolbar-toggle.has-value{ background:#eef5ff; color:#007bff; border-color:#d7e7ff; }

    .mode-switch{
      display:grid;
      grid-template-columns:1fr 1fr;
      background:#eef5ff;
      border:1px solid #d7e7ff;
      border-radius:14px;
      padding:4px;
      gap:4px;
      flex:1;
    }

    .mode-btn{
      appearance:none;
      border:none;
      background:transparent;
      color:#4b5b73;
      font-family:"Poppins",sans-serif;
      font-size:14px;
      font-weight:800;
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      transition:all .18s ease;
    }

    .mode-btn.active{
      background:#007bff;
      color:#fff;
      box-shadow:0 4px 12px rgba(0,123,255,.18);
    }

    .icon-btn svg{ width:18px; height:18px; display:block; }

    /* Mobiel: schermvullend, grotere cijfers en knoppen, werkbalk vast onderaan */
    @media (max-width:520px){
      /* De hele pagina laten scrollen (niet alleen body): anders blijft iOS na het
         sluiten van het toetsenbord omhoog geschoven en is de bovenkant onbereikbaar. */
      html,body{height:auto}
      body{
        display:block;
        min-height:100%;
        overflow-y:visible;
        background:#fff;
        padding:calc(env(safe-area-inset-top) + 36px) 0 0;
      }
      .card{
        max-width:none;
        border:none;
        border-radius:0;
        box-shadow:none;
        padding:0 16px calc(env(safe-area-inset-bottom) + 96px);
      }
      .logo{padding:0 0 22px}
      .logo img{width:auto;height:26px}

      /* Rustiger: geen scheidingslijnen, vaste ruimte tussen de blokken */
      .section{gap:8px;padding:10px 0 12px}
      .section + .section{border-top:none}
      .section-title{font-size:12px;letter-spacing:.06em;margin-left:2px}

      /* Velden: invoerveld wit met blauwe rand, uitgerekend veld lichtgrijs */
      .row-2,.price-stack{gap:10px}
      .field{border-radius:16px;min-height:0;border:1px solid #e3e5e8}
      .field.main{border:2px solid #007bff;box-shadow:0 0 0 4px rgba(0,123,255,.08)}
      .field:not(.main){background:#f4f5f7;border-color:#f4f5f7}
      .field:not(.main) .field-top,
      .field:not(.main) input[type="number"]{background:transparent}
      .field-top{min-height:0;padding:12px 14px 12px;gap:6px;align-items:baseline;background:transparent}
      .field input[type="number"],
      .field input[type="text"]{font-size:32px;line-height:1.1;height:36px;background:transparent}
      .affix{font-size:18px;flex:0 0 13px;width:13px;min-width:0;padding-top:0;line-height:1;align-self:baseline;text-align:left}
      .value-wrap{gap:2px}
      .field-note{font-size:11px;margin:2px 0 0 -19px;letter-spacing:.06em}

      /* Prijs na korting op een eigen regel direct onder het bedrag */
      .price-meta{position:static;transform:none;display:none;justify-content:flex-start;max-width:none;padding:0;margin:-2px 0 0 -19px}
      .price-meta.show{display:flex}
      .meta-discounted{font-size:17px}

      /* Marge */
      .summary{padding:12px}
      .pill{padding:16px 14px}
      .biginput input{font-size:34px}
      .bigprefix{font-size:16px}


      /* Werkbalk vast onderaan */
      .toolbar-section{
        position:fixed;
        left:0;
        right:0;
        bottom:0;
        z-index:10;
        padding:10px 16px calc(env(safe-area-inset-bottom) + 8px);
        background:rgba(255,255,255,.92);
        -webkit-backdrop-filter:blur(14px);
        backdrop-filter:blur(14px);
        border-top:1px solid #eef0f2 !important;
      }
      .toolbar{gap:12px}
      .toolbar-toggle,.icon-btn{width:48px;height:48px;flex-basis:48px}
      .mode-switch{border-radius:16px}
      .mode-btn{padding:12px 14px;font-size:15px;border-radius:12px}
    }
    @media (max-width:380px){
      .field input[type="number"],
      .field input[type="text"]{font-size:26px;height:30px}
      .biginput input{font-size:28px}
      .affix{font-size:15px;flex-basis:11px;width:11px}
      .field-note,.price-meta{margin-left:-17px}
      .field-top{padding:10px 11px}
      .pill{padding:12px}
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="logo.png" alt="Logo">
    </div>

    <div class="section">
      <div class="section-title">Purchase price</div>
      <div class="price-stack" id="purchaseGrid">
        <div class="field main" id="purchaseExWrap">
          <div class="field-top">
            <div class="affix">&euro;</div>
            <div class="value-wrap">
              <input type="number" id="purchaseEx" min="0" inputmode="decimal" enterkeyhint="done" placeholder="0" />
              <div class="price-meta" id="purchaseExMeta">
                <span class="meta-current"><span class="money-symbol">&euro;</span><span class="money-value"></span></span>
                <span class="meta-discounted"><span class="money-symbol">&euro;</span><span class="money-value"></span></span>
              </div>
              <div class="field-note">Excl.</div>
            </div>
          </div>
        </div>

        <div class="field" id="purchaseInWrap">
          <div class="field-top">
            <div class="affix">&euro;</div>
            <div class="value-wrap">
              <input type="number" id="purchaseIn" min="0" inputmode="decimal" enterkeyhint="done" placeholder="0" />
              <div class="price-meta" id="purchaseInMeta">
                <span class="meta-current"><span class="money-symbol">&euro;</span><span class="money-value"></span></span>
                <span class="meta-discounted"><span class="money-symbol">&euro;</span><span class="money-value"></span></span>
              </div>
              <div class="field-note">Incl.</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Selling price</div>
      <div class="row-2" id="sellGrid">
        <div class="field main" id="sellInWrap">
          <div class="field-top">
            <div class="affix">&euro;</div>
            <div class="value-wrap">
              <input type="number" id="sellIn" min="0" inputmode="decimal" enterkeyhint="done" placeholder="0" />
              <div class="price-meta" id="sellInMeta">
                <span class="meta-current"><span class="money-symbol">&euro;</span><span class="money-value"></span></span>
                <span class="meta-discounted"><span class="money-symbol">&euro;</span><span class="money-value"></span></span>
              </div>
              <div class="field-note">Incl.</div>
            </div>
          </div>
        </div>

        <div class="field" id="sellExWrap">
          <div class="field-top">
            <div class="affix">&euro;</div>
            <div class="value-wrap">
              <input type="number" id="sellEx" min="0" inputmode="decimal" enterkeyhint="done" placeholder="0" />
              <div class="price-meta" id="sellExMeta">
                <span class="meta-current"><span class="money-symbol">&euro;</span><span class="money-value"></span></span>
                <span class="meta-discounted"><span class="money-symbol">&euro;</span><span class="money-value"></span></span>
              </div>
              <div class="field-note">Excl.</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Margin</div>
      <div class="summary">
        <div class="summary-grid">
          <div class="pill">
            <div class="biginput">
              <span class="bigprefix">%</span>
              <input type="text" id="mPct" inputmode="decimal" enterkeyhint="done" />
            </div>
          </div>
          <div class="pill">
            <div class="biginput">
              <span class="bigprefix">&euro;</span>
              <input type="text" id="mEur" inputmode="decimal" enterkeyhint="done" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="section discount-shell" id="discountShell">
      <div class="section-title">Discount</div>

      <div class="discount-card" id="discountCard">
        <div class="discount-row" data-scope="purchase">
          <label class="discount-label" for="pDiscValue">Purchase condition</label>
          <div class="discount-control">
            <input type="number" id="pDiscValue" class="discount-input" inputmode="decimal" enterkeyhint="done" placeholder="0" min="0" step="0.01" autocomplete="off">
            <div class="discount-toggle" role="group" aria-label="Purchase discount unit">
              <button type="button" id="pDiscModePct" class="active" aria-pressed="true">%</button>
              <button type="button" id="pDiscModeEur" aria-pressed="false">&euro;</button>
            </div>
            <input type="hidden" id="pDiscPct" class="discount-hidden">
            <input type="hidden" id="pDiscEur" class="discount-hidden">
          </div>
        </div>

        <div class="discount-row" data-scope="selling">
          <label class="discount-label" for="discValue">Selling discount</label>
          <div class="discount-control">
            <input type="number" id="discValue" class="discount-input" inputmode="decimal" enterkeyhint="done" placeholder="0" min="0" step="0.01" autocomplete="off">
            <div class="discount-toggle" role="group" aria-label="Selling discount unit">
              <button type="button" id="discModePct" class="active" aria-pressed="true">%</button>
              <button type="button" id="discModeEur" aria-pressed="false">&euro;</button>
            </div>
            <input type="hidden" id="discPct" class="discount-hidden">
            <input type="hidden" id="discEur" class="discount-hidden">
          </div>
        </div>
      </div>
    </div>

    <div class="section toolbar-section">
      <div class="toolbar">
        <button type="button" class="toolbar-toggle" id="discountToggle" aria-label="Discount" title="Discount">%</button>

        <div class="mode-switch">
          <button type="button" class="mode-btn active" id="modeVat">Sales</button>
          <button type="button" class="mode-btn" id="modeMargin">Margin</button>
        </div>

        <button type="button" class="icon-btn" id="resetBtn" aria-label="Reset" title="Reset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 6h18"></path>
            <path d="M8 6V4h8v2"></path>
            <path d="M19 6l-1 14H6L5 6"></path>
            <path d="M10 10v6"></path>
            <path d="M14 10v6"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const VAT = 1.21;
    const STORAGE_KEY = "margins_tool_state_v16";
    const el = (id) => document.getElementById(id);

    const raw = (id) => el(id).value;
    const hasVal = (id) => raw(id).trim() !== "";
    const num = (id) => {
      const v = parseFloat(el(id).value);
      return Number.isFinite(v) ? v : null;
    };

    const floorOrEmpty = (v) => (v === null || v === "" || Number.isNaN(v)) ? "" : Math.floor(v);
    const ceilOrEmpty = (v) => (v === null || v === "" || Number.isNaN(v)) ? "" : Math.ceil(v);
    const setVal = (id, v) => { el(id).value = floorOrEmpty(v); };
    const setText = (id, v) => { el(id).value = v; };
    const clear = (ids) => ids.forEach(i => el(i).value = "");
    const clamp = (n, a, b) => Math.min(Math.max(n, a), b);

    let updating = false;
    let lastEdited = null;
    let marginLock = null;
    let taxMode = "vat";
    let discountManualOpen = false;
    let pDiscUnit = "pct";
    let discUnit = "pct";
    // Korting zoals de gebruiker hem invulde. Wisselen tussen % en EUR verandert alleen de
    // weergave; de berekening blijft op deze waarde gebaseerd (geen afrondingsdrift).
    let pDiscSrc = null;
    let discSrc = null;

    function formatNum(v){ return String(Math.floor(Math.max(v || 0, 0))); }

    function setMeta(id, currentVal, discountedVal){
      const node = el(id);
      const current = node.querySelector(".meta-current .money-value");
      const discounted = node.querySelector(".meta-discounted .money-value");

      const field = node.closest(".field");

      if (currentVal === null || discountedVal === null || Math.floor(currentVal) === Math.floor(discountedVal)) {
        current.textContent = "";
        discounted.textContent = "";
        node.classList.remove("show");
        if (field) field.classList.remove("discounted");
        return;
      }

      current.textContent = formatNum(currentVal);
      discounted.textContent = formatNum(discountedVal);
      node.classList.add("show");
      if (field) field.classList.add("discounted");
    }

    function syncPair(aId, bId, mult){
      if (taxMode === "margin") return;
      if (lastEdited === aId && raw(aId).trim() === "") { clear([bId]); return; }
      if (lastEdited === bId && raw(bId).trim() === "") { clear([aId]); return; }
      const a = num(aId); const b = num(bId);
      if (lastEdited === bId && b !== null) setVal(aId, b * mult);
      else if (lastEdited === aId && a !== null) setVal(bId, a / mult);
      else {
        if (a === null && b !== null) setVal(aId, b * mult);
        if (b === null && a !== null) setVal(bId, a / mult);
      }
    }

    function captureMarginLock(){
      if (lastEdited === "mPct") {
        if (!hasVal("mPct") || raw("mPct").trim() === "-") { marginLock = null; return; }
        const p = num("mPct"); if (p === null) return;
        marginLock = { mode:"pct", value: clamp(p,0,99) };
      }
      if (lastEdited === "mEur") {
        if (!hasVal("mEur") || raw("mEur").trim() === "-") { marginLock = null; return; }
        const e = num("mEur"); if (e === null) return;
        marginLock = { mode:"eur", value: Math.max(e,0) };
      }
    }

    function unlockMarginIfNeeded(){
      if (["purchaseEx","purchaseIn","sellIn","sellEx","discValue","pDiscValue","discPct","discEur","pDiscPct","pDiscEur"].includes(lastEdited)) {
        marginLock = null;
      }
    }

    function updateModeVisuals(){
      el("modeVat").classList.toggle("active", taxMode === "vat");
      el("modeMargin").classList.toggle("active", taxMode === "margin");
    }

    function updateDiscountModeUI(scope){
      const isPurchase = scope === "purchase";
      const unit = isPurchase ? pDiscUnit : discUnit;
      const pctBtn = el(isPurchase ? "pDiscModePct" : "discModePct");
      const eurBtn = el(isPurchase ? "pDiscModeEur" : "discModeEur");

      pctBtn.classList.toggle("active", unit === "pct");
      eurBtn.classList.toggle("active", unit === "eur");
      pctBtn.setAttribute("aria-pressed", unit === "pct" ? "true" : "false");
      eurBtn.setAttribute("aria-pressed", unit === "eur" ? "true" : "false");
    }

    function updateRequiredFields(){
      const purchaseExWrap = el("purchaseExWrap");
      const purchaseInWrap = el("purchaseInWrap");
      const sellExWrap = el("sellExWrap");
      const sellInWrap = el("sellInWrap");
      const sellGrid = el("sellGrid");
      const purchaseGrid = el("purchaseGrid");

      [purchaseExWrap, purchaseInWrap, sellExWrap, sellInWrap].forEach(node => {
        node.classList.remove("main", "hidden");
      });

      if (taxMode === "margin") {
        purchaseExWrap.classList.add("main");
        sellExWrap.classList.add("main");
        purchaseInWrap.classList.add("hidden");
        sellInWrap.classList.add("hidden");
        sellGrid.style.gridTemplateColumns = "1fr";
        purchaseGrid.style.gridTemplateColumns = "1fr";
      } else {
        purchaseExWrap.classList.add("main");
        sellInWrap.classList.add("main");
        sellGrid.style.gridTemplateColumns = "1fr 1fr";
        purchaseGrid.style.gridTemplateColumns = "1fr 1fr";
      }
    }

    function getPurchaseBaseEx(){ const ex=num("purchaseEx"); const inc=num("purchaseIn"); if (ex!==null) return ex; return inc!==null ? inc/VAT : null; }
    function getPurchaseBaseIn(){ const ex=num("purchaseEx"); const inc=num("purchaseIn"); if (taxMode==="margin") return null; if (inc!==null) return inc; return ex!==null ? ex*VAT : null; }
    // In Sales-modus is de prijs incl. leidend; het excl.-veld is daarvan een afgeronde weergave.
    function getSellBaseEx(){ const ex=num("sellEx"); const inc=num("sellIn"); if (taxMode==="vat" && inc!==null) return inc/VAT; if (ex!==null) return ex; return inc!==null ? inc/VAT : null; }
    function getSellBaseIn(){ const ex=num("sellEx"); const inc=num("sellIn"); if (taxMode==="margin") return null; if (inc!==null) return inc; return ex!==null ? ex*VAT : null; }

    function getBasePurchaseValue(){ return getPurchaseBaseEx(); }
    function getBaseSellValue(){ return taxMode === "margin" ? getSellBaseEx() : getSellBaseIn(); }

    function getDiscountedPurchaseEx(){
      const baseEx = getPurchaseBaseEx(); if (baseEx===null) return null;
      if (pDiscUnit === "eur") {
        if (hasVal("pDiscEur")) { const e=num("pDiscEur"); if (e!==null) return Math.max(baseEx-Math.max(e,0),0); }
      } else if (hasVal("pDiscPct")) {
        const p=num("pDiscPct"); if (p!==null) return Math.max(baseEx*(1-clamp(p,0,99)/100),0);
      }
      return baseEx;
    }

    function getDiscountedPurchaseIn(){
      const discountedEx = getDiscountedPurchaseEx();
      if (discountedEx===null || taxMode==="margin") return null;
      return discountedEx * VAT;
    }

    function getDiscountedSellEx(){
      const baseEx = getSellBaseEx(); if (baseEx===null) return null;
      if (discUnit === "eur") {
        if (hasVal("discEur")) { const e=num("discEur"); if (e!==null) return Math.max(baseEx-(taxMode==="margin"?Math.max(e,0):Math.max(e,0)/VAT),0); }
      } else if (hasVal("discPct")) {
        const p=num("discPct"); if (p!==null) return Math.max(baseEx*(1-clamp(p,0,99)/100),0);
      }
      return baseEx;
    }

    function getDiscountedSellIn(){
      const baseIn = getSellBaseIn(); if (baseIn===null) return null;
      if (discUnit === "eur") {
        if (hasVal("discEur")) { const e=num("discEur"); if (e!==null) return Math.max(baseIn-Math.max(e,0),0); }
      } else if (hasVal("discPct")) {
        const p=num("discPct"); if (p!==null) return Math.max(baseIn*(1-clamp(p,0,99)/100),0);
      }
      return baseIn;
    }

    function setTaxMode(mode){
      const nextMode = mode === "margin" ? "margin" : "vat";
      if (taxMode === nextMode) return;

      taxMode = nextMode;
      updateModeVisuals();

      if (taxMode === "margin") {
        clear(["purchaseIn","sellIn"]);
      } else {
        const purchaseEx=num("purchaseEx"), sellEx=num("sellEx");
        if (purchaseEx!==null) setVal("purchaseIn", purchaseEx*VAT);
        if (sellEx!==null) setVal("sellIn", sellEx*VAT);
      }

      clear(["discPct","discEur","pDiscPct","pDiscEur","discValue","pDiscValue"]);
      discSrc = null;
      pDiscSrc = null;
      updateRequiredFields();
      saveToLocal();
      recalc();
    }

    function discountFromSource(src, base){
      if (!src || !base || base <= 0) return null;
      const pct = src.unit === "pct" ? clamp(src.value,0,99) : clamp((Math.max(src.value,0) / base) * 100,0,99);
      const eur = src.unit === "eur" ? Math.max(src.value,0) : base * (pct / 100);
      return { pct, eur };
    }

    function syncPurchaseDiscountFields(){
      const d = discountFromSource(pDiscSrc, getBasePurchaseValue());
      if (!d) { clear(["pDiscPct","pDiscEur"]); return; }
      el("pDiscPct").value = d.pct;
      el("pDiscEur").value = d.eur;
    }

    function syncDiscountFields(){
      const d = discountFromSource(discSrc, getBaseSellValue());
      if (!d) { clear(["discPct","discEur"]); return; }
      el("discPct").value = d.pct;
      el("discEur").value = d.eur;
    }

    function discountDisplay(src, unit, pctId, eurId){
      if (!src) return "";
      if (src.unit === unit) return String(src.value);
      const v = num(unit === "pct" ? pctId : eurId);
      if (v === null) return "";
      return unit === "pct" ? String(Math.round(v * 10) / 10) : String(Math.round(v));
    }

    function syncDiscountVisibleFromHidden(){
      // Het veld waarin nu getypt wordt niet overschrijven.
      if (lastEdited !== "pDiscValue") el("pDiscValue").value = discountDisplay(pDiscSrc, pDiscUnit, "pDiscPct", "pDiscEur");
      if (lastEdited !== "discValue") el("discValue").value = discountDisplay(discSrc, discUnit, "discPct", "discEur");
      updateDiscountModeUI("purchase");
      updateDiscountModeUI("selling");
    }

    function setDiscountMode(scope, unit){
      if (scope === "purchase") pDiscUnit = unit;
      else discUnit = unit;
      updateDiscountModeUI(scope);
      lastEdited = scope === "purchase" ? "pDiscMode" : "discMode";
      recalc();
      queueSave();
    }

    function updatePurchaseMeta(){
      const originalEx = getPurchaseBaseEx();
      const originalIn = getPurchaseBaseIn();
      const discountedEx = getDiscountedPurchaseEx();
      const discountedIn = getDiscountedPurchaseIn();
      const discountOn = hasVal("pDiscValue");
      if (!discountOn) { setMeta("purchaseExMeta", null, null); setMeta("purchaseInMeta", null, null); return; }
      setMeta("purchaseExMeta", originalEx, discountedEx);
      setMeta("purchaseInMeta", originalIn, discountedIn);
    }

    function updateSellMeta(){
      const originalEx = getSellBaseEx();
      const originalIn = getSellBaseIn();
      const discountedEx = getDiscountedSellEx();
      const discountedIn = getDiscountedSellIn();
      const discountOn = hasVal("discValue");
      if (!discountOn) { setMeta("sellExMeta", null, null); setMeta("sellInMeta", null, null); return; }
      setMeta("sellExMeta", originalEx, discountedEx);
      setMeta("sellInMeta", originalIn, discountedIn);
    }

    function updateDiscountPanels(){
      const purchaseHasValue = hasVal("pDiscValue");
      const sellHasValue = hasVal("discValue");
      const anyHasValue = purchaseHasValue || sellHasValue;
      el("discountToggle").classList.toggle("has-value", anyHasValue);
      const open = anyHasValue || discountManualOpen;
      el("discountShell").classList.toggle("show", open);
      el("discountToggle").classList.toggle("active", open);
    }

    function setMarginDash(){ setText("mPct","-"); setText("mEur","-"); }

    function applyMarginIfPossible(){
      const purchaseEx = getDiscountedPurchaseEx();
      if (!purchaseEx || purchaseEx <= 0 || !marginLock) return;

      clear(["discPct","discEur","discValue"]);
      discSrc = null;

      // Verkoopprijs naar boven afronden, zodat de marge nooit onder de ingevulde waarde uitkomt
      // (ook niet nadat de marge later opnieuw uit de afgeronde prijs wordt berekend).
      const setSellFromNet = (net) => {
        if (taxMode==="vat") {
          const inc = Math.ceil(net*VAT - 1e-9);
          el("sellIn").value = inc;
          setVal("sellEx", inc/VAT);
        } else {
          el("sellEx").value = Math.ceil(net - 1e-9);
        }
      };
      if (marginLock.mode === "pct") {
        const p=clamp(marginLock.value,0,99), net=purchaseEx/(1-(p/100)), profit=net-purchaseEx;
        setSellFromNet(net);
        setText("mEur",Math.floor(profit));
        setText("mPct",Math.floor(p));
      } else {
        const profit=Math.max(marginLock.value,0), net=purchaseEx+profit, pct=net>0?(profit/net)*100:0;
        setSellFromNet(net);
        setText("mPct",Math.floor(clamp(pct,0,99)));
        setText("mEur",Math.floor(profit));
      }
    }

    function updateMarginFromCurrent(){
      if (lastEdited === "mPct" || lastEdited === "mEur") return;
      const purchaseEx=getDiscountedPurchaseEx(), discountedSellEx=getDiscountedSellEx();
      if (!purchaseEx || !discountedSellEx || purchaseEx<=0) { clear(["mPct","mEur"]); return; }
      const net=discountedSellEx; if (!(net>0)) { clear(["mPct","mEur"]); return; }
      const profit=net-purchaseEx, pct=(profit/net)*100;
      if (profit<=0 || pct<=0) { setMarginDash(); return; }
      setText("mPct", String(Math.floor(clamp(pct,0,99))));
      setText("mEur", String(Math.floor(profit)));
    }

    function recalc(){
      if (updating) return;
      updating = true;

      syncPair("purchaseIn","purchaseEx",VAT);
      syncPair("sellIn","sellEx",VAT);

      if (lastEdited === "pDiscValue") {
        const v = num("pDiscValue");
        pDiscSrc = (hasVal("pDiscValue") && v !== null) ? { unit: pDiscUnit, value: v } : null;
      }
      if (lastEdited === "discValue") {
        const v = num("discValue");
        discSrc = (hasVal("discValue") && v !== null) ? { unit: discUnit, value: v } : null;
      }

      unlockMarginIfNeeded();
      captureMarginLock();

      if (["mPct","mEur"].includes(lastEdited)) {
        applyMarginIfPossible();
        syncPair("sellIn","sellEx",VAT);
      }

      syncPurchaseDiscountFields();
      syncDiscountFields();
      syncDiscountVisibleFromHidden();

      updatePurchaseMeta();
      updateSellMeta();
      updateDiscountPanels();
      updateMarginFromCurrent();

      updating = false;
    }

    function bind(id){
      const input = el(id); if (!input) return;
      input.addEventListener("input", ()=>{ lastEdited=id; recalc(); queueSave(); });
      input.addEventListener("focus", ()=>{ setTimeout(()=>{ try{input.select();}catch(e){} },0); });
      input.addEventListener("keydown", (e)=>{ if (e.key === "Enter") { e.preventDefault(); input.blur(); } });
    }

    function setPrices({
      purchaseEx=null,
      purchaseIn=null,
      pDiscPct=null,
      pDiscEur=null,
      sellIn=null,
      sellEx=null,
      discPct=null,
      discEur=null
    } = {}){
      updating = true;

      if (purchaseEx !== null) el("purchaseEx").value = ceilOrEmpty(purchaseEx);
      if (purchaseIn !== null) el("purchaseIn").value = ceilOrEmpty(purchaseIn);

      if (pDiscPct !== null) { pDiscUnit = "pct"; pDiscSrc = { unit: "pct", value: pDiscPct }; }
      else if (pDiscEur !== null) { pDiscUnit = "eur"; pDiscSrc = { unit: "eur", value: pDiscEur }; }
      else pDiscSrc = null;

      if (sellIn !== null) el("sellIn").value = floorOrEmpty(sellIn);
      if (sellEx !== null) el("sellEx").value = floorOrEmpty(sellEx);

      if (discPct !== null) { discUnit = "pct"; discSrc = { unit: "pct", value: discPct }; }
      else if (discEur !== null) { discUnit = "eur"; discSrc = { unit: "eur", value: discEur }; }
      else discSrc = null;

      marginLock = null;
      lastEdited = null;

      if (taxMode === "vat") {
        syncPair("purchaseIn","purchaseEx",VAT);
        syncPair("sellIn","sellEx",VAT);
      }

      updating = false;
      lastEdited = taxMode === "margin" ? "sellEx" : "sellIn";
      recalc();
    }

    function loadFromQueryString(){
      const qs = new URLSearchParams(window.location.search);
      const p=qs.get("p"), pi=qs.get("pi"), pdp=qs.get("pdp"), pde=qs.get("pde"), s=qs.get("s"), se=qs.get("se"), dp=qs.get("dp"), de=qs.get("de"), tm=qs.get("tm");

      if (tm === "vat" || tm === "margin") taxMode = tm;
      updateModeVisuals();
      updateRequiredFields();

      const obj = {};
      if (p) obj.purchaseEx=parseFloat(p);
      if (pi) obj.purchaseIn=parseFloat(pi);
      if (pdp) obj.pDiscPct=parseFloat(pdp);
      if (pde) obj.pDiscEur=parseFloat(pde);
      if (s) obj.sellIn=parseFloat(s);
      if (se) obj.sellEx=parseFloat(se);
      if (dp) obj.discPct=parseFloat(dp);
      if (de) obj.discEur=parseFloat(de);

      if (Object.keys(obj).length) setPrices(obj);
    }

    function saveToLocal(){
      const data = {
        purchaseEx: raw("purchaseEx"),
        purchaseIn: raw("purchaseIn"),
        pDiscPct: raw("pDiscPct"),
        pDiscEur: raw("pDiscEur"),
        sellIn: raw("sellIn"),
        sellEx: raw("sellEx"),
        discPct: raw("discPct"),
        discEur: raw("discEur"),
        taxMode,
        discountManualOpen,
        pDiscUnit,
        discUnit,
        pDiscSrc,
        discSrc
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function queueSave(){
      clearTimeout(window.__saveT);
      window.__saveT = setTimeout(saveToLocal, 120);
    }

    function loadFromLocal(){
      try {
        const s = localStorage.getItem(STORAGE_KEY);
        if (!s) return false;

        const data = JSON.parse(s);

        if (data.taxMode === "vat" || data.taxMode === "margin") taxMode = data.taxMode;
        if (data.pDiscUnit === "pct" || data.pDiscUnit === "eur") pDiscUnit = data.pDiscUnit;
        if (data.discUnit === "pct" || data.discUnit === "eur") discUnit = data.discUnit;

        discountManualOpen = !!data.discountManualOpen;
        updateModeVisuals();
        updateRequiredFields();
        updateDiscountModeUI("purchase");
        updateDiscountModeUI("selling");

        const any=[
          "purchaseEx","purchaseIn","pDiscPct","pDiscEur",
          "sellIn","sellEx","discPct","discEur"
        ].some(k => (data[k] ?? "").toString().trim() !== "");

        if (!any) return false;

        const srcArgs = (src, unit, pct, eur) => {
          if (src && (src.unit === "pct" || src.unit === "eur") && Number.isFinite(src.value)) return src.unit === "pct" ? [src.value, null] : [null, src.value];
          // oudere opslag zonder bron: de eenheid gebruiken die zichtbaar was
          const p = pct !== "" && pct != null ? parseFloat(pct) : null, e = eur !== "" && eur != null ? parseFloat(eur) : null;
          return unit === "eur" ? [null, e ?? null] : [p ?? null, null];
        };
        const [pdp, pde] = srcArgs(data.pDiscSrc, data.pDiscUnit, data.pDiscPct, data.pDiscEur);
        const [dp, de] = srcArgs(data.discSrc, data.discUnit, data.discPct, data.discEur);

        setPrices({
          purchaseEx: data.purchaseEx !== "" ? parseFloat(data.purchaseEx) : null,
          purchaseIn: data.purchaseIn !== "" ? parseFloat(data.purchaseIn) : null,
          pDiscPct: pdp,
          pDiscEur: pde,
          sellIn: data.sellIn !== "" ? parseFloat(data.sellIn) : null,
          sellEx: data.sellEx !== "" ? parseFloat(data.sellEx) : null,
          discPct: dp,
          discEur: de
        });

        // de eenheid die zichtbaar was terugzetten (kan afwijken van de ingevulde eenheid)
        if (data.pDiscUnit === "pct" || data.pDiscUnit === "eur") pDiscUnit = data.pDiscUnit;
        if (data.discUnit === "pct" || data.discUnit === "eur") discUnit = data.discUnit;
        lastEdited = null;
        recalc();

        return true;
      } catch {
        return false;
      }
    }

    function resetAll(){
      updating = true;

      [
        "purchaseEx","purchaseIn","pDiscValue","pDiscPct","pDiscEur",
        "sellIn","sellEx","discValue","discPct","discEur","mPct","mEur"
      ].forEach(id => el(id).value = "");

      pDiscUnit = "pct";
      discUnit = "pct";
      pDiscSrc = null;
      discSrc = null;
      marginLock = null;
      lastEdited = null;
      discountManualOpen = false;
      updating = false;

      localStorage.removeItem(STORAGE_KEY);

      setMeta("purchaseExMeta", null, null);
      setMeta("purchaseInMeta", null, null);
      setMeta("sellExMeta", null, null);
      setMeta("sellInMeta", null, null);

      updateDiscountModeUI("purchase");
      updateDiscountModeUI("selling");
      updateRequiredFields();
      recalc();
    }

    window.addEventListener("DOMContentLoaded", ()=>{
      [
        "purchaseEx","purchaseIn","sellIn","sellEx",
        "pDiscValue","discValue","mPct","mEur"
      ].forEach(bind);

      el("modeVat").addEventListener("click", ()=>setTaxMode("vat"));
      el("modeMargin").addEventListener("click", ()=>setTaxMode("margin"));

      el("pDiscModePct").addEventListener("click", ()=>setDiscountMode("purchase","pct"));
      el("pDiscModeEur").addEventListener("click", ()=>setDiscountMode("purchase","eur"));
      el("discModePct").addEventListener("click", ()=>setDiscountMode("selling","pct"));
      el("discModeEur").addEventListener("click", ()=>setDiscountMode("selling","eur"));

      el("resetBtn").addEventListener("click", resetAll);

      el("discountToggle").addEventListener("click", ()=>{
        const willOpen = !el("discountShell").classList.contains("show");
        discountManualOpen = willOpen;

        if (!willOpen) {
          clear(["pDiscValue","discValue","pDiscPct","pDiscEur","discPct","discEur"]);
          pDiscSrc = null;
          discSrc = null;
          lastEdited = "pDiscValue";
          recalc();
        } else {
          updateDiscountPanels();
        }

        queueSave();
      });

      updateModeVisuals();
      updateRequiredFields();
      updateDiscountModeUI("purchase");
      updateDiscountModeUI("selling");

      const loadedLocal = loadFromLocal();
      loadFromQueryString();

      if (!loadedLocal && !window.location.search) recalc();

      window.setPrices = setPrices;
    });

    // iOS schuift de pagina omhoog als het toetsenbord opent en zet hem niet altijd terug.
    // Onthoud de scrollpositie van voor het typen en zet die terug zodra het toetsenbord dicht is.
    (function keepTopAfterKeyboard(){
      const isField = (n) => n && (n.tagName === "INPUT" || n.tagName === "TEXTAREA");
      let savedY = null;
      // laatste scrollpositie terwijl er geen veld actief was (dus voor het automatisch verschuiven)
      let idleY = window.scrollY;
      window.addEventListener("scroll", () => { if (!isField(document.activeElement)) idleY = window.scrollY; }, { passive: true });
      document.addEventListener("pointerdown", () => { if (!isField(document.activeElement)) idleY = window.scrollY; }, true);
      document.addEventListener("focusin", (e) => {
        if (isField(e.target) && savedY === null) savedY = idleY;
      });
      const restore = () => {
        if (savedY === null || isField(document.activeElement)) return;
        const y = savedY; savedY = null;
        window.scrollTo(0, y);
      };
      document.addEventListener("focusout", () => setTimeout(restore, 120));
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", () => {
          // toetsenbord dicht: zichtbare hoogte weer (bijna) gelijk aan de vensterhoogte
          if (window.visualViewport.height >= window.innerHeight - 40) setTimeout(restore, 60);
        });
      }
    })();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
    }
  </script>
</body>
</html>
