<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Margins</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#f3f3f3;
  font-family:"Poppins",sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.card{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:16px;
  padding:18px;
  box-shadow:0 8px 24px rgba(0,0,0,.06);
}

.section{padding:10px 0}
.section + .section{border-top:1px solid #eee}

.section-title{
  font-size:11px;
  font-weight:800;
  opacity:.6;
}

.row-main{
  display:grid;
  grid-template-columns:1fr 1fr 42px;
  gap:10px;
}

.input{
  border:1px solid #ddd;
  border-radius:12px;
  overflow:hidden;
}

.price-top{
  display:flex;
  align-items:center;
}

.prefix,.suffix{
  background:#f4f4f4;
  padding:10px;
  font-weight:900;
}

input{
  width:100%;
  border:none;
  outline:none;
  padding:12px;
  font-size:20px;
  font-weight:900;
}

.discount-toggle{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid #ddd;
  background:#f4f4f4;
  font-weight:900;
}

.discount-row{
  display:none;
  margin-top:6px;
  padding-right:52px;
}

.discount-row.show{display:block}

.discount-fields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

/* 🔥 NEW PRICE BLOCK */
.price-after{
  display:none;
  margin:6px;
  padding:6px 10px;
  font-size:16px;
  font-weight:900;
  border:1px solid #e6edf8;
  border-radius:10px;
  background:#fff;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.price-after.show{display:flex}

.price-new-black{
  color:#111;
}

.price-new-blue{
  color:#007bff;
}
</style>
</head>

<body>
<div class="card">

<!-- PURCHASE -->
<div class="section">
<div class="section-title">Purchase</div>

<div class="row-main">
<div class="input">
<div class="price-top">
<div class="prefix">€</div>
<input id="purchaseEx">
<div class="suffix">Excl.</div>
</div>
<div class="price-after" id="purchaseExAfter"></div>
</div>

<div class="input">
<div class="price-top">
<div class="prefix">€</div>
<input id="purchaseIn">
<div class="suffix">Incl.</div>
</div>
<div class="price-after" id="purchaseInAfter"></div>
</div>

<button class="discount-toggle" id="purchaseToggle">%</button>
</div>

<div class="discount-row" id="purchaseDiscount">
<div class="discount-fields">
<input id="pDiscPct" placeholder="%">
<input id="pDiscEur" placeholder="€">
</div>
</div>
</div>

<!-- SELL -->
<div class="section">
<div class="section-title">Selling</div>

<div class="row-main">
<div class="input">
<div class="price-top">
<div class="prefix">€</div>
<input id="sellIn">
<div class="suffix">Incl.</div>
</div>
<div class="price-after" id="sellInAfter"></div>
</div>

<div class="input">
<div class="price-top">
<div class="prefix">€</div>
<input id="sellEx">
<div class="suffix">Excl.</div>
</div>
<div class="price-after" id="sellExAfter"></div>
</div>

<button class="discount-toggle" id="sellToggle">%</button>
</div>

<div class="discount-row" id="sellDiscount">
<div class="discount-fields">
<input id="discPct" placeholder="%">
<input id="discEur" placeholder="€">
</div>
</div>
</div>

</div>

<script>
const VAT = 1.21;

function num(id){
  const v = parseFloat(document.getElementById(id).value);
  return isNaN(v) ? null : v;
}

function setAfter(id, oldVal, newVal){
  const el = document.getElementById(id);

  if(!oldVal || !newVal || Math.floor(oldVal)===Math.floor(newVal)){
    el.classList.remove("show");
    el.innerHTML="";
    return;
  }

  el.innerHTML = `
    <span class="price-new-black">${Math.floor(oldVal)}</span>
    <span class="price-new-blue">${Math.floor(newVal)}</span>
  `;

  el.classList.add("show");
}

function updatePurchase(){
  const ex = num("purchaseEx");
  const inc = num("purchaseIn");

  let newEx = ex;
  let newIn = inc;

  if(num("pDiscPct")){
    newEx = ex * (1 - num("pDiscPct")/100);
    newIn = inc * (1 - num("pDiscPct")/100);
  }

  if(num("pDiscEur")){
    newIn = inc - num("pDiscEur");
    newEx = newIn / VAT;
  }

  setAfter("purchaseExAfter", ex, newEx);
  setAfter("purchaseInAfter", inc, newIn);
}

function updateSell(){
  const ex = num("sellEx");
  const inc = num("sellIn");

  let newEx = ex;
  let newIn = inc;

  if(num("discPct")){
    newEx = ex * (1 - num("discPct")/100);
    newIn = inc * (1 - num("discPct")/100);
  }

  if(num("discEur")){
    newIn = inc - num("discEur");
    newEx = newIn / VAT;
  }

  setAfter("sellExAfter", ex, newEx);
  setAfter("sellInAfter", inc, newIn);
}

document.querySelectorAll("input").forEach(i=>{
  i.addEventListener("input", ()=>{
    updatePurchase();
    updateSell();
  });
});

document.getElementById("purchaseToggle").onclick=()=>{
  const row = document.getElementById("purchaseDiscount");
  const open = row.classList.toggle("show");

  if(!open){
    document.getElementById("pDiscPct").value="";
    document.getElementById("pDiscEur").value="";
    updatePurchase();
  }
};

document.getElementById("sellToggle").onclick=()=>{
  const row = document.getElementById("sellDiscount");
  const open = row.classList.toggle("show");

  if(!open){
    document.getElementById("discPct").value="";
    document.getElementById("discEur").value="";
    updateSell();
  }
};
</script>
</body>
</html>
