<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Margins</title>

  <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%}

    body{
      background:#f3f3f3;
      font-family:"Poppins",sans-serif;
      overflow-y:auto;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 18px);
    }

    .card{
      width:100%;
      max-width:420px;
      background:#fff;
      border:1px solid #e8e8e8;
      border-radius:16px;
      box-shadow:0 8px 24px rgba(0,0,0,.06);
      padding:18px;
    }

    .logo{display:flex;justify-content:center;padding:6px 0 12px}
    .logo img{width:min(320px,86vw);height:auto;display:block}

    .section{display:flex;flex-direction:column;gap:8px;padding:10px 0}
    .section + .section{border-top:1px solid #f1f1f1}

    .section-title{
      font-size:12px;
      font-weight:800;
      color:#111;
      opacity:1;
      letter-spacing:.03em;
      text-transform:uppercase;
      margin-left:2px;
    }

    .row-2,
    .price-stack{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .field{
      display:flex;
      flex-direction:column;
      border:1px solid #d8d8d8;
      border-radius:14px;
      background:#fff;
      overflow:hidden;
      min-height:60px;
      position:relative;
      transition:border-color .18s ease, box-shadow .18s ease, opacity .18s ease;
    }

    .field.main{
      border:2px solid #007bff;
      box-shadow:0 0 0 3px rgba(0,123,255,.08);
    }

    .field.hidden{display:none !important}

    .field-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      width:100%;
      background:#fff;
      padding:6px 12px 10px;
      gap:2px;
      min-height:60px;
    }

    .value-wrap{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      justify-content:center;
      flex:1;
      min-width:0;
      gap:0;
    }

    .field-note{
      font-size:10px;
      font-weight:900;
      color:#111;
      opacity:1;
      line-height:1;
      text-transform:uppercase;
      letter-spacing:.03em;
      margin-top:-3px;
    }

    .affix{
      font-size:12px;
      font-weight:900;
      color:#111;
      opacity:1;
      min-width:10px;
      line-height:1;
      padding-top:4px;
      text-align:center;
      flex:0 0 10px;
    }

    .field input[type="number"],
    .field input[type="text"]{
      width:100%;
      min-width:0;
      border:none;
      outline:none;
      padding:0;
      font-size:24px;
      font-weight:900;
      color:#111;
      background:#fff;
      line-height:1;
      text-align:left;
      font-variant-numeric:tabular-nums;
      font-family:"Poppins",sans-serif;
    }

    .field input::placeholder,
    .biginput input::placeholder,
    .discount-input::placeholder{color:#b4b4b4}

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
    input[type="number"]{ -moz-appearance:textfield; appearance:textfield; }

    .price-meta{
      position:absolute;
      right:10px;
      top:50%;
      transform:translateY(-50%);
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:6px;
      font-variant-numeric:tabular-nums;
      min-height:18px;
      visibility:hidden;
      opacity:0;
      transition:opacity .18s ease;
      pointer-events:none;
      max-width:46%;
    }

    .price-meta.show{
      visibility:visible;
      opacity:1;
    }

    .meta-current{
      display:none;
    }

    .meta-discounted{
      display:flex;
      align-items:baseline;
      gap:2px;
      line-height:1;
      white-space:nowrap;
      color:#007bff;
      font-size:22px;
      font-weight:900;
    }

    .money-symbol,
    .bigprefix{
      font-size:12px;
      font-weight:900;
      line-height:1;
      opacity:1;
      color:inherit;
    }

    .money-value{font-size:1em;line-height:1}

    .discount-shell{display:none}
    .discount-shell.show{display:block}

    .discount-card{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
      padding:10px;
      border:1px solid #d8d8d8;
      border-radius:14px;
      background:#fafafa;
      margin-bottom:8px;
    }

    .discount-row{
      display:grid;
      grid-template-columns:78px 1fr;
      gap:10px;
      align-items:start;
    }

    .discount-label{
      font-size:10px;
      font-weight:900;
      color:#111;
      opacity:1;
      text-transform:uppercase;
      letter-spacing:.03em;
      padding-left:2px;
      padding-top:12px;
    }

    .discount-control{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .discount-input{
      width:100%;
      min-width:0;
      border:1px solid #d8d8d8;
      outline:none;
      border-radius:14px;
      background:#fff;
      min-height:46px;
      padding:0 14px;
      font-size:18px;
      font-weight:900;
      color:#111;
      line-height:1;
      font-variant-numeric:tabular-nums;
      font-family:"Poppins",sans-serif;
      transition:border-color .18s ease, box-shadow .18s ease;
    }

    .discount-input:focus{
      border-color:#007bff;
      box-shadow:0 0 0 3px rgba(0,123,255,.08);
    }

    .discount-toggle{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:4px;
      padding:4px;
      border:1px solid #d8d8d8;
      border-radius:14px;
      background:#fff;
    }

    .discount-toggle button{
      appearance:none;
      border:none;
      background:transparent;
      color:#4b5b73;
      font-family:"Poppins",sans-serif;
      font-size:14px;
      font-weight:800;
      padding:10px 12px;
      border-radius:10px;
      cursor:pointer;
      transition:all .18s ease;
    }

    .discount-toggle button.active{
      background:#007bff;
      color:#fff;
      box-shadow:0 4px 12px rgba(0,123,255,.18);
    }

    .discount-hint{
      font-size:10px;
      font-weight:700;
      color:#6d6d6d;
      letter-spacing:.01em;
      padding-left:2px;
      min-height:12px;
    }

    .discount-hidden{display:none !important}

    .summary{
      margin-top:0;
      padding:14px;
      border-radius:14px;
      background:#007bff;
      color:#fff;
    }

    .summary-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .pill{
      border-radius:14px;
      padding:12px;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.22);
    }

    .biginput{
      display:flex;
      align-items:baseline;
      gap:6px;
    }

    .biginput input{
      border:none;
      outline:none;
      background:transparent;
      color:#fff;
      font-size:24px;
      font-weight:900;
      width:100%;
      padding:0;
      line-height:1.05;
      text-align:left;
      font-family:"Poppins",sans-serif;
    }

    .toolbar{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .toolbar-toggle,
    .icon-btn{
      width:42px;
      height:42px;
      border:none;
      border-radius:999px;
      background:#f4f4f4;
      color:#666;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      flex:0 0 42px;
      transition:all .18s ease;
      border:1px solid #e3e3e3;
      font-family:"Poppins",sans-serif;
    }

    .toolbar-toggle{
      font-size:16px;
      font-weight:900;
    }

    .toolbar-toggle:hover,.icon-btn:hover{ background:#ededed; color:#111; }
    .toolbar-toggle:active,.icon-btn:active{ transform:scale(.96) }
    .toolbar-toggle.active,.toolbar-toggle.has-value{ background:#eef5ff; color:#007bff; border-color:#d7e7ff; }

    .mode-switch{
      display:grid;
      grid-template-columns:1fr 1fr;
      background:#eef5ff;
      border:1px solid #d7e7ff;
      border-radius:14px;
      padding:4px;
      gap:4px;
      flex:1;
    }

    .mode-btn{
      appearance:none;
      border:none;
      background:transparent;
      color:#4b5b73;
      font-family:"Poppins",sans-serif;
      font-size:14px;
      font-weight:800;
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      transition:all .18s ease;
    }

    .mode-btn.active{
      background:#007bff;
      color:#fff;
      box-shadow:0 4px 12px rgba(0,123,255,.18);
    }

    .icon-btn svg{ width:18px; height:18px; display:block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="logo.png" alt="Logo">
    </div>

    <div class="section">
      <div class="section-title">Purchase</div>
      <div class="price-stack" id="purchaseGrid">
        <div class="field main" id="purchaseExWrap">
          <div class="field-top">
            <div class="affix">€</div>
            <div class="value-wrap">
              <input type="number" id="purchaseEx" min="0" inputmode="decimal" placeholder="0" />
              <div class="field-note">Excl.</div>
            </div>
          </div>
          <div class="price-meta" id="purchaseExMeta">
            <span class="meta-current"><span class="money-symbol">€</span><span class="money-value"></span></span>
            <span class="meta-discounted"><span class="money-symbol">€</span><span class="money-value"></span></span>
          </div>
        </div>

        <div class="field" id="purchaseInWrap">
          <div class="field-top">
            <div class="affix">€</div>
            <div class="value-wrap">
              <input type="number" id="purchaseIn" min="0" inputmode="decimal" placeholder="0" />
              <div class="field-note">Incl.</div>
            </div>
          </div>
          <div class="price-meta" id="purchaseInMeta">
            <span class="meta-current"><span class="money-symbol">€</span><span class="money-value"></span></span>
            <span class="meta-discounted"><span class="money-symbol">€</span><span class="money-value"></span></span>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Selling</div>
      <div class="row-2" id="sellGrid">
        <div class="field main" id="sellInWrap">
          <div class="field-top">
            <div class="affix">€</div>
            <div class="value-wrap">
              <input type="number" id="sellIn" min="0" inputmode="decimal" placeholder="0" />
              <div class="field-note">Incl.</div>
            </div>
          </div>
          <div class="price-meta" id="sellInMeta">
            <span class="meta-current"><span class="money-symbol">€</span><span class="money-value"></span></span>
            <span class="meta-discounted"><span class="money-symbol">€</span><span class="money-value"></span></span>
          </div>
        </div>

        <div class="field" id="sellExWrap">
          <div class="field-top">
            <div class="affix">€</div>
            <div class="value-wrap">
              <input type="number" id="sellEx" min="0" inputmode="decimal" placeholder="0" />
              <div class="field-note">Excl.</div>
            </div>
          </div>
          <div class="price-meta" id="sellExMeta">
            <span class="meta-current"><span class="money-symbol">€</span><span class="money-value"></span></span>
            <span class="meta-discounted"><span class="money-symbol">€</span><span class="money-value"></span></span>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Margin</div>
      <div class="summary">
        <div class="summary-grid">
          <div class="pill">
            <div class="biginput">
              <span class="bigprefix">%</span>
              <input type="text" id="mPct" inputmode="decimal" />
            </div>
          </div>
          <div class="pill">
            <div class="biginput">
              <span class="bigprefix">€</span>
              <input type="text" id="mEur" inputmode="decimal" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="section discount-shell" id="discountShell">
      <div class="section-title">Discount</div>

      <div class="discount-card" id="discountCard">
        <div class="discount-row" data-scope="purchase">
          <label class="discount-label" for="pDiscValue">Purchase</label>
          <div class="discount-control">
            <input type="number" id="pDiscValue" class="discount-input" inputmode="decimal" placeholder="0" min="0" step="0.01" autocomplete="off" aria-describedby="pDiscHint">
            <div class="discount-toggle" role="group" aria-label="Purchase discount unit">
              <button type="button" id="pDiscModePct" class="active" aria-pressed="true">%</button>
              <button type="button" id="pDiscModeEur" aria-pressed="false">€</button>
            </div>
            <input type="hidden" id="pDiscPct" class="discount-hidden">
            <input type="hidden" id="pDiscEur" class="discount-hidden">
            <div class="discount-hint" id="pDiscHint">Voer korting in procenten in</div>
          </div>
        </div>

        <div class="discount-row" data-scope="selling">
          <label class="discount-label" for="discValue">Selling</label>
          <div class="discount-control">
            <input type="number" id="discValue" class="discount-input" inputmode="decimal" placeholder="0" min="0" step="0.01" autocomplete="off" aria-describedby="discHint">
            <div class="discount-toggle" role="group" aria-label="Selling discount unit">
              <button type="button" id="discModePct" class="active" aria-pressed="true">%</button>
              <button type="button" id="discModeEur" aria-pressed="false">€</button>
            </div>
            <input type="hidden" id="discPct" class="discount-hidden">
            <input type="hidden" id="discEur" class="discount-hidden">
            <div class="discount-hint" id="discHint">Voer korting in procenten in</div>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="toolbar">
        <button type="button" class="toolbar-toggle" id="discountToggle" aria-label="Discount" title="Discount">%</button>

        <div class="mode-switch">
          <button type="button" class="mode-btn active" id="modeVat">Sales</button>
          <button type="button" class="mode-btn" id="modeMargin">Margin</button>
        </div>

        <button type="button" class="icon-btn" id="resetBtn" aria-label="Reset" title="Reset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 6h18"></path>
            <path d="M8 6V4h8v2"></path>
            <path d="M19 6l-1 14H6L5 6"></path>
            <path d="M10 10v6"></path>
            <path d="M14 10v6"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const VAT = 1.21;
    const STORAGE_KEY = "margins_tool_state_v14";
    const el = (id) => document.getElementById(id);

    const raw = (id) => el(id).value;
    const hasVal = (id) => raw(id).trim() !== "";
    const num = (id) => {
      const v = parseFloat(el(id).value);
      return Number.isFinite(v) ? v : null;
    };

    const floorOrEmpty = (v) => (v === null || v === "" || Number.isNaN(v)) ? "" : Math.floor(v);
    const ceilOrEmpty = (v) => (v === null || v === "" || Number.isNaN(v)) ? "" : Math.ceil(v);
    const setVal = (id, v) => { el(id).value = floorOrEmpty(v); };
    const setText = (id, v) => { el(id).value = v; };
    const clear = (ids) => ids.forEach(i => el(i).value = "");
    const clamp = (n, a, b) => Math.min(Math.max(n, a), b);

    let updating = false;
    let lastEdited = null;
    let marginLock = null;
    let taxMode = "vat";
    let discountManualOpen = false;
    let pDiscUnit = "pct";
    let discUnit = "pct";

    function formatNum(v){ return String(Math.floor(Math.max(v || 0, 0))); }

    function setMeta(id, currentVal, discountedVal){
      const node = el(id);
      const current = node.querySelector(".meta-current .money-value");
      const discounted = node.querySelector(".meta-discounted .money-value");

      if (currentVal === null || discountedVal === null || Math.floor(currentVal) === Math.floor(discountedVal)) {
        current.textContent = "";
        discounted.textContent = "";
        node.classList.remove("show");
        return;
      }

      current.textContent = formatNum(currentVal);
      discounted.textContent = formatNum(discountedVal);
      node.classList.add("show");
    }

    function syncPair(aId, bId, mult){
      if (taxMode === "margin") return;
      if (lastEdited === aId && raw(aId).trim() === "") { clear([bId]); return; }
      if (lastEdited === bId && raw(bId).trim() === "") { clear([aId]); return; }
      const a = num(aId); const b = num(bId);
      if (lastEdited === bId && b !== null) setVal(aId, b * mult);
      else if (lastEdited === aId && a !== null) setVal(bId, a / mult);
      else {
        if (a === null && b !== null) setVal(aId, b * mult);
        if (b === null && a !== null) setVal(bId, a / mult);
      }
    }

    function captureMarginLock(){
      if (lastEdited === "mPct") {
        if (!hasVal("mPct") || raw("mPct").trim() === "-") { marginLock = null; return; }
        const p = num("mPct"); if (p === null) return;
        marginLock = { mode:"pct", value: clamp(p,0,99) };
      }
      if (lastEdited === "mEur") {
        if (!hasVal("mEur") || raw("mEur").trim() === "-") { marginLock = null; return; }
        const e = num("mEur"); if (e === null) return;
        marginLock = { mode:"eur", value: Math.max(e,0) };
      }
    }

    function unlockMarginIfNeeded(){
      if (["purchaseEx","purchaseIn","sellIn","sellEx","discValue","pDiscValue","discPct","discEur","pDiscPct","pDiscEur"].includes(lastEdited)) marginLock = null;
    }

    function updateModeVisuals(){
      el("modeVat").classList.toggle("active", taxMode === "vat");
      el("modeMargin").classList.toggle("active", taxMode === "margin");
    }

    function updateDiscountModeUI(scope){
      const isPurchase = scope === "purchase";
      const unit = isPurchase ? pDiscUnit : discUnit;

      const pctBtn = el(isPurchase ? "pDiscModePct" : "discModePct");
      const eurBtn = el(isPurchase ? "pDiscModeEur" : "discModeEur");
      const hint = el(isPurchase ? "pDiscHint" : "discHint");

      pctBtn.classList.toggle("active", unit === "pct");
      eurBtn.classList.toggle("active", unit === "eur");
      pctBtn.setAttribute("aria-pressed", unit === "pct" ? "true" : "false");
      eurBtn.setAttribute("aria-pressed", unit === "eur" ? "true" : "false");
      hint.textContent = unit === "pct" ? "Voer korting in procenten in" : "Voer korting in euro in";
    }

    function updateRequiredFields(){
      const purchaseExWrap = el("purchaseExWrap");
      const purchaseInWrap = el("purchaseInWrap");
      const sellExWrap = el("sellExWrap");
      const sellInWrap = el("sellInWrap");
      const sellGrid = el("sellGrid");
      const purchaseGrid = el("purchaseGrid");

      [purchaseExWrap, purchaseInWrap, sellExWrap, sellInWrap].forEach(node => {
        node.classList.remove("main", "hidden");
      });

      if (taxMode === "margin") {
        purchaseExWrap.classList.add("main");
        sellExWrap.classList.add("main");
        purchaseInWrap.classList.add("hidden");
        sellInWrap.classList.add("hidden");
        sellGrid.style.gridTemplateColumns = "1fr";
        purchaseGrid.style.gridTemplateColumns = "1fr";
      } else {
        purchaseExWrap.classList.add("main");
        sellInWrap.classList.add("main");
        sellGrid.style.gridTemplateColumns = "1fr 1fr";
        purchaseGrid.style.gridTemplateColumns = "1fr 1fr";
      }
    }

    function getPurchaseBaseEx(){ const ex=num("purchaseEx"); const inc=num("purchaseIn"); if (ex!==null) return ex; return inc!==null ? inc/VAT : null; }
    function getPurchaseBaseIn(){ const ex=num("purchaseEx"); const inc=num("purchaseIn"); if (taxMode==="margin") return null; if (inc!==null) return inc; return ex!==null ? ex*VAT : null; }
    function getSellBaseEx(){ const ex=num("sellEx"); const inc=num("sellIn"); if (ex!==null) return ex; return inc!==null ? inc/VAT : null; }
    function getSellBaseIn(){ const ex=num("sellEx"); const inc=num("sellIn"); if (taxMode==="margin") return null; if (inc!==null) return inc; return ex!==null ? ex*VAT : null; }
    function getBasePurchaseValue(){ return taxMode === "margin" ? getPurchaseBaseEx() : getPurchaseBaseIn(); }
    function getBaseSellValue(){ return taxMode === "margin" ? getSellBaseEx() : getSellBaseIn(); }

    function setDiscountMode(scope, unit){
      const inputId = scope === "purchase" ? "pDiscValue" : "discValue";
      const pctId = scope === "purchase" ? "pDiscPct" : "discPct";
      const eurId = scope === "purchase" ? "pDiscEur" : "discEur";
      const currentVisible = num(inputId);

      if (scope === "purchase") pDiscUnit = unit;
      else discUnit = unit;

      if (currentVisible === null) {
        clear([pctId, eurId]);
      } else {
        if (unit === "pct") {
          setVal(pctId, currentVisible);
          clear([eurId]);
        } else {
          setVal(eurId, currentVisible);
          clear([pctId]);
        }
      }

      updateDiscountModeUI(scope);
      lastEdited = inputId;
      recalc();
      queueSave();
    }

    function syncDiscountHiddenFromVisible(){
      if (hasVal("pDiscValue")) {
        if (pDiscUnit === "pct") {
          setVal("pDiscPct", num("pDiscValue"));
          clear(["pDiscEur"]);
        } else {
          setVal("pDiscEur", num("pDiscValue"));
          clear(["pDiscPct"]);
        }
      } else {
        clear(["pDiscPct","pDiscEur"]);
      }

      if (hasVal("discValue")) {
        if (discUnit === "pct") {
          setVal("discPct", num("discValue"));
          clear(["discEur"]);
        } else {
          setVal("discEur", num("discValue"));
          clear(["discPct"]);
        }
      } else {
        clear(["discPct","discEur"]);
      }
    }

    function syncDiscountVisibleFromHidden(){
      el("pDiscValue").value = pDiscUnit === "pct" ? raw("pDiscPct") : raw("pDiscEur");
      el("discValue").value = discUnit === "pct" ? raw("discPct") : raw("discEur");
      updateDiscountModeUI("purchase");
      updateDiscountModeUI("selling");
    }

    function getDiscountedPurchaseEx(){
      const baseEx = getPurchaseBaseEx(); if (baseEx===null) return null;
      if (hasVal("pDiscPct")) { const p=num("pDiscPct"); if (p!==null) return Math.max(baseEx*(1-clamp(p,0,99)/100),0); }
      if (hasVal("pDiscEur")) { const e=num("pDiscEur"); if (e!==null) return Math.max(baseEx-(taxMode==="margin"?Math.max(e,0):Math.max(e,0)/VAT),0); }
      return baseEx;
    }

    function getDiscountedPurchaseIn(){
      const baseIn = getPurchaseBaseIn(); if (baseIn===null) return null;
      if (hasVal("pDiscPct")) { const p=num("pDiscPct"); if (p!==null) return Math.max(baseIn*(1-clamp(p,0,99)/100),0); }
      if (hasVal("pDiscEur")) { const e=num("pDiscEur"); if (e!==null) return Math.max(baseIn-Math.max(e,0),0); }
      return baseIn;
    }

    function getDiscountedSellEx(){
      const baseEx = getSellBaseEx(); if (baseEx===null) return null;
      if (hasVal("discPct")) { const p=num("discPct"); if (p!==null) return Math.max(baseEx*(1-clamp(p,0,99)/100),0); }
      if (hasVal("discEur")) { const e=num("discEur"); if (e!==null) return Math.max(baseEx-(taxMode==="margin"?Math.max(e,0):Math.max(e,0)/VAT),0); }
      return baseEx;
    }

    function getDiscountedSellIn(){
      const baseIn = getSellBaseIn(); if (baseIn===null) return null;
      if (hasVal("discPct")) { const p=num("discPct"); if (p!==null) return Math.max(baseIn*(1-clamp(p,0,99)/100),0); }
      if (hasVal("discEur")) { const e=num("discEur"); if (e!==null) return Math.max(baseIn-Math.max(e,0),0); }
      return baseIn;
    }

    function setTaxMode(mode){
      const nextMode = mode === "margin" ? "margin" : "vat";
      if (taxMode === nextMode) return;
      taxMode = nextMode;
      updateModeVisuals();

      if (taxMode === "margin") {
        clear(["purchaseIn","sellIn"]);
      } else {
        const purchaseEx=num("purchaseEx"), sellEx=num("sellEx");
        if (purchaseEx!==null) setVal("purchaseIn", purchaseEx*VAT);
        if (sellEx!==null) setVal("sellIn", sellEx*VAT);
      }

      clear(["discPct","discEur","pDiscPct","pDiscEur","discValue","pDiscValue"]);
      updateRequiredFields();
      saveToLocal();
      recalc();
    }

    function syncPurchaseDiscountFields(){
      const basePurchase = getBasePurchaseValue();

      if (["pDiscValue","pDiscPct","pDiscEur"].includes(lastEdited) && !hasVal("pDiscValue")) {
        clear(["pDiscPct","pDiscEur"]);
        return;
      }

      if (!basePurchase || basePurchase <= 0) {
        if (["pDiscValue","pDiscPct","pDiscEur"].includes(lastEdited)) clear(["pDiscPct","pDiscEur"]);
        return;
      }

      if (hasVal("pDiscPct")) {
        const pct=num("pDiscPct"); if (pct===null) return;
        const p=clamp(pct,0,99), eur=basePurchase*(p/100);
        setVal("pDiscPct",p); setVal("pDiscEur",eur);
      } else if (hasVal("pDiscEur")) {
        const eur=num("pDiscEur"); if (eur===null) return;
        const e=Math.max(eur,0), pct=basePurchase>0?(e/basePurchase)*100:0;
        setVal("pDiscEur",e); setVal("pDiscPct",clamp(pct,0,99));
      }
    }

    function syncDiscountFields(){
      const baseSell = getBaseSellValue();

      if (["discValue","discPct","discEur"].includes(lastEdited) && !hasVal("discValue")) {
        clear(["discPct","discEur"]);
        return;
      }

      if (!baseSell || baseSell <= 0) {
        if (["discValue","discPct","discEur"].includes(lastEdited)) clear(["discPct","discEur"]);
        return;
      }

      if (hasVal("discPct")) {
        const pct=num("discPct"); if (pct===null) return;
        const p=clamp(pct,0,99), eur=baseSell*(p/100);
        setVal("discPct",p); setVal("discEur",eur);
      } else if (hasVal("discEur")) {
        const eur=num("discEur"); if (eur===null) return;
        const e=Math.max(eur,0), pct=baseSell>0?(e/baseSell)*100:0;
        setVal("discEur",e); setVal("discPct",clamp(pct,0,99));
      }
    }

    function updatePurchaseMeta(){
      const originalEx = getPurchaseBaseEx();
      const originalIn = getPurchaseBaseIn();
      const discountedEx = getDiscountedPurchaseEx();
      const discountedIn = getDiscountedPurchaseIn();
      const discountOn = hasVal("pDiscValue");
      if (!discountOn) { setMeta("purchaseExMeta", null, null); setMeta("purchaseInMeta", null, null); return; }
      setMeta("purchaseExMeta", originalEx, discountedEx);
      setMeta("purchaseInMeta", originalIn, discountedIn);
    }

    function updateSellMeta(){
      const originalEx = getSellBaseEx();
      const originalIn = getSellBaseIn();
      const discountedEx = getDiscountedSellEx();
      const discountedIn = getDiscountedSellIn();
      const discountOn = hasVal("discValue");
      if (!discountOn) { setMeta("sellExMeta", null, null); setMeta("sellInMeta", null, null); return; }
      setMeta("sellExMeta", originalEx, discountedEx);
      setMeta("sellInMeta", originalIn, discountedIn);
    }

    function updateDiscountPanels(){
      const purchaseHasValue = hasVal("pDiscValue");
      const sellHasValue = hasVal("discValue");
      const anyHasValue = purchaseHasValue || sellHasValue;
      el("discountToggle").classList.toggle("has-value", anyHasValue);
      const open = anyHasValue || discountManualOpen;
      el("discountShell").classList.toggle("show", open);
      el("discountToggle").classList.toggle("active", open);
    }

    function setMarginDash(){ setText("mPct","-"); setText("mEur","-"); }

    function applyMarginIfPossible(){
      const purchaseEx = getDiscountedPurchaseEx();
      if (!purchaseEx || purchaseEx <= 0 || !marginLock) return;

      clear(["discPct","discEur","discValue"]);

      if (marginLock.mode === "pct") {
        const p=clamp(marginLock.value,0,99), net=purchaseEx/(1-(p/100)), profit=net-purchaseEx;
        setVal("sellEx",net);
        if (taxMode==="vat") setVal("sellIn",net*VAT);
        setText("mEur",Math.floor(profit));
        setText("mPct",Math.floor(p));
      } else {
        const profit=Math.max(marginLock.value,0), net=purchaseEx+profit, pct=net>0?(profit/net)*100:0;
        setVal("sellEx",net);
        if (taxMode==="vat") setVal("sellIn",net*VAT);
        setText("mPct",Math.floor(clamp(pct,0,99)));
        setText("mEur",Math.floor(profit));
      }
    }

    function updateMarginFromCurrent(){
      if (lastEdited === "mPct" || lastEdited === "mEur") return;
      const purchaseEx=getDiscountedPurchaseEx(), discountedSellEx=getDiscountedSellEx();
      if (!purchaseEx || !discountedSellEx || purchaseEx<=0) { clear(["mPct","mEur"]); return; }
      const net=discountedSellEx; if (!(net>0)) { clear(["mPct","mEur"]); return; }
      const profit=net-purchaseEx, pct=(profit/net)*100;
      if (profit<=0 || pct<=0) { setMarginDash(); return; }
      setText("mPct", String(Math.floor(clamp(pct,0,99))));
      setText("mEur", String(Math.floor(profit)));
    }

    function recalc(){
      if (updating) return;
      updating = true;

      syncPair("purchaseIn","purchaseEx",VAT);
      syncPair("sellIn","sellEx",VAT);

      syncDiscountHiddenFromVisible();
      unlockMarginIfNeeded();
      captureMarginLock();

      if (["mPct","mEur"].includes(lastEdited)) {
        applyMarginIfPossible();
        syncPair("sellIn","sellEx",VAT);
      }

      syncPurchaseDiscountFields();
      syncDiscountFields();
      syncDiscountVisibleFromHidden();

      updatePurchaseMeta();
      updateSellMeta();
      updateDiscountPanels();
      updateMarginFromCurrent();

      updating = false;
    }

    function bind(id){
      const input = el(id); if (!input) return;
      input.addEventListener("input", ()=>{ lastEdited=id; recalc(); queueSave(); });
      input.addEventListener("focus", ()=>{ setTimeout(()=>{ try{input.select();}catch(e){} },0); });
    }

    function setPrices({
      purchaseEx=null,
      purchaseIn=null,
      pDiscPct=null,
      pDiscEur=null,
      sellIn=null,
      sellEx=null,
      discPct=null,
      discEur=null
    } = {}){
      updating = true;

      if (purchaseEx !== null) el("purchaseEx").value = ceilOrEmpty(purchaseEx);
      if (purchaseIn !== null) el("purchaseIn").value = ceilOrEmpty(purchaseIn);

      if (pDiscPct !== null) {
        pDiscUnit = "pct";
        el("pDiscPct").value = floorOrEmpty(pDiscPct);
        el("pDiscEur").value = "";
      } else if (pDiscEur !== null) {
        pDiscUnit = "eur";
        el("pDiscEur").value = floorOrEmpty(pDiscEur);
        el("pDiscPct").value = "";
      } else {
        el("pDiscPct").value = "";
        el("pDiscEur").value = "";
      }

      if (sellIn !== null) el("sellIn").value = floorOrEmpty(sellIn);
      if (sellEx !== null) el("sellEx").value = floorOrEmpty(sellEx);

      if (discPct !== null) {
        discUnit = "pct";
        el("discPct").value = floorOrEmpty(discPct);
        el("discEur").value = "";
      } else if (discEur !== null) {
        discUnit = "eur";
        el("discEur").value = floorOrEmpty(discEur);
        el("discPct").value = "";
      } else {
        el("discPct").value = "";
        el("discEur").value = "";
      }

      syncDiscountVisibleFromHidden();

      marginLock = null;
      lastEdited = null;

      if (taxMode === "vat") {
        syncPair("purchaseIn","purchaseEx",VAT);
        syncPair("sellIn","sellEx",VAT);
      }

      updating = false;
      lastEdited = taxMode === "margin" ? "sellEx" : "sellIn";
      recalc();
    }

    function loadFromQueryString(){
      const qs = new URLSearchParams(window.location.search);
      const p=qs.get("p"), pi=qs.get("pi"), pdp=qs.get("pdp"), pde=qs.get("pde"), s=qs.get("s"), se=qs.get("se"), dp=qs.get("dp"), de=qs.get("de"), tm=qs.get("tm");
      if (tm === "vat" || tm === "margin") taxMode = tm;
      updateModeVisuals(); updateRequiredFields();

      const obj = {};
      if (p) obj.purchaseEx=parseFloat(p);
      if (pi) obj.purchaseIn=parseFloat(pi);
      if (pdp) obj.pDiscPct=parseFloat(pdp);
      if (pde) obj.pDiscEur=parseFloat(pde);
      if (s) obj.sellIn=parseFloat(s);
      if (se) obj.sellEx=parseFloat(se);
      if (dp) obj.discPct=parseFloat(dp);
      if (de) obj.discEur=parseFloat(de);

      if (Object.keys(obj).length) setPrices(obj);
    }

    function saveToLocal(){
      const data = {
        purchaseEx: raw("purchaseEx"),
        purchaseIn: raw("purchaseIn"),
        pDiscPct: raw("pDiscPct"),
        pDiscEur: raw("pDiscEur"),
        sellIn: raw("sellIn"),
        sellEx: raw("sellEx"),
        discPct: raw("discPct"),
        discEur: raw("discEur"),
        taxMode,
        discountManualOpen,
        pDiscUnit,
        discUnit
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function queueSave(){
      clearTimeout(window.__saveT);
      window.__saveT = setTimeout(saveToLocal, 120);
    }

    function loadFromLocal(){
      try {
        const s = localStorage.getItem(STORAGE_KEY);
        if (!s) return false;

        const data = JSON.parse(s);
        if (data.taxMode === "vat" || data.taxMode === "margin") taxMode = data.taxMode;
        if (data.pDiscUnit === "pct" || data.pDiscUnit === "eur") pDiscUnit = data.pDiscUnit;
        if (data.discUnit === "pct" || data.discUnit === "eur") discUnit = data.discUnit;

        discountManualOpen = !!data.discountManualOpen;
        updateModeVisuals();
        updateRequiredFields();
        updateDiscountModeUI("purchase");
        updateDiscountModeUI("selling");

        const any=[
          "purchaseEx","purchaseIn","pDiscPct","pDiscEur",
          "sellIn","sellEx","discPct","discEur"
        ].some(k => (data[k] ?? "").toString().trim() !== "");

        if (!any) return false;

        setPrices({
          purchaseEx: data.purchaseEx !== "" ? parseFloat(data.purchaseEx) : null,
          purchaseIn: data.purchaseIn !== "" ? parseFloat(data.purchaseIn) : null,
          pDiscPct: data.pDiscPct !== "" ? parseFloat(data.pDiscPct) : null,
          pDiscEur: data.pDiscEur !== "" ? parseFloat(data.pDiscEur) : null,
          sellIn: data.sellIn !== "" ? parseFloat(data.sellIn) : null,
          sellEx: data.sellEx !== "" ? parseFloat(data.sellEx) : null,
          discPct: data.discPct !== "" ? parseFloat(data.discPct) : null,
          discEur: data.discEur !== "" ? parseFloat(data.discEur) : null
        });

        return true;
      } catch {
        return false;
      }
    }

    function resetAll(){
      updating = true;
      [
        "purchaseEx","purchaseIn","pDiscValue","pDiscPct","pDiscEur",
        "sellIn","sellEx","discValue","discPct","discEur","mPct","mEur"
      ].forEach(id => el(id).value = "");

      pDiscUnit = "pct";
      discUnit = "pct";
      marginLock = null;
      lastEdited = null;
      discountManualOpen = false;
      updating = false;

      localStorage.removeItem(STORAGE_KEY);

      setMeta("purchaseExMeta", null, null);
      setMeta("purchaseInMeta", null, null);
      setMeta("sellExMeta", null, null);
      setMeta("sellInMeta", null, null);

      updateDiscountModeUI("purchase");
      updateDiscountModeUI("selling");
      updateRequiredFields();
      recalc();
    }

    window.addEventListener("DOMContentLoaded", ()=>{
      [
        "purchaseEx","purchaseIn","sellIn","sellEx",
        "pDiscValue","discValue","mPct","mEur"
      ].forEach(bind);

      el("modeVat").addEventListener("click", ()=>setTaxMode("vat"));
      el("modeMargin").addEventListener("click", ()=>setTaxMode("margin"));

      el("pDiscModePct").addEventListener("click", ()=>setDiscountMode("purchase","pct"));
      el("pDiscModeEur").addEventListener("click", ()=>setDiscountMode("purchase","eur"));
      el("discModePct").addEventListener("click", ()=>setDiscountMode("selling","pct"));
      el("discModeEur").addEventListener("click", ()=>setDiscountMode("selling","eur"));

      el("resetBtn").addEventListener("click", resetAll);

      el("discountToggle").addEventListener("click", ()=>{
        const willOpen = !el("discountShell").classList.contains("show");
        discountManualOpen = willOpen;

        if (!willOpen) {
          clear(["pDiscValue","discValue","pDiscPct","pDiscEur","discPct","discEur"]);
          lastEdited = "pDiscValue";
          recalc();
        } else {
          updateDiscountPanels();
        }

        queueSave();
      });

      updateModeVisuals();
      updateRequiredFields();
      updateDiscountModeUI("purchase");
      updateDiscountModeUI("selling");

      const loadedLocal = loadFromLocal();
      loadFromQueryString();

      if (!loadedLocal && !window.location.search) recalc();

      window.setPrices = setPrices;
    });
  </script>
</body>
</html>
