<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Margins</title>

  <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%}
    body{
      background:#f3f3f3;
      font-family:"Poppins",sans-serif;
      overflow-y:auto;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 18px);
    }
    .card{
      width:100%;
      max-width:420px;
      background:#fff;
      border:1px solid #e8e8e8;
      border-radius:16px;
      box-shadow:0 8px 24px rgba(0,0,0,.06);
      padding:18px;
    }
    .logo{display:flex;justify-content:center;padding:6px 0 12px}
    .logo img{width:min(320px,86vw);height:auto;display:block}

    .section{display:flex;flex-direction:column;gap:8px;padding:10px 0}
    .section + .section{border-top:1px solid #f1f1f1}
    .section-title{
      font-size:11px;
      font-weight:800;
      color:#111;
      opacity:.55;
      letter-spacing:.03em;
      text-transform:uppercase;
      margin-left:2px;
    }

    .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

    .input{
      display:flex;
      align-items:center;
      border:1px solid #dcdcdc;
      border-radius:12px;
      overflow:hidden;
      background:#fff;
    }
    .prefix,.suffix{
      font-size:13px;
      font-weight:900;
      color:#111;
      background:#f4f4f4;
      padding:10px 10px;
      white-space:nowrap;
    }
    .prefix{border-right:1px solid #e2e2e2}
    .suffix{border-left:1px solid #e2e2e2}

    input[type="number"]{
      width:100%;
      border:none;
      outline:none;
      padding:12px 12px;
      font-size:16px;
      font-weight:900;
      color:#111;
      background:#fff;
    }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
    input[type="number"]{ -moz-appearance:textfield; appearance:textfield; }

    .summary{
      margin-top:12px;
      padding:14px;
      border-radius:14px;
      background:#007bff;
      color:#fff;
    }
    .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .pill{
      border-radius:14px;
      padding:12px;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.22);
    }
    .pill .k{
      font-size:12px;
      opacity:.95;
      font-weight:900;
      margin-bottom:8px;
    }
    .biginput{display:flex;align-items:baseline;gap:6px}
    .bigprefix{font-size:18px;font-weight:900}
    .biginput input{
      border:none;outline:none;background:transparent;color:#fff;
      font-size:26px;font-weight:900;width:100%;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo">
      <img src="logo.png" alt="Logo">
    </div>

    <div class="section">
      <div class="section-title">Purchase</div>
      <div class="row2">
        <div class="input">
          <div class="prefix">€</div>
          <input type="number" id="purchaseEx" />
          <div class="suffix">Excl.</div>
        </div>
        <div class="input">
          <div class="prefix">€</div>
          <input type="number" id="purchaseIn" />
          <div class="suffix">Incl.</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Selling</div>
      <div class="row2">
        <div class="input">
          <div class="prefix">€</div>
          <input type="number" id="sellIn" />
          <div class="suffix">Incl.</div>
        </div>
        <div class="input">
          <div class="prefix">€</div>
          <input type="number" id="sellEx" />
          <div class="suffix">Excl.</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Discount</div>
      <div class="row2">
        <div class="input">
          <div class="prefix">%</div>
          <input type="number" id="discPct" />
        </div>
        <div class="input">
          <div class="prefix">€</div>
          <input type="number" id="discEur" />
        </div>
      </div>
    </div>

    <div class="summary">
      <div class="summary-grid">
        <div class="pill">
          <div class="k">Margin %</div>
          <div class="biginput">
            <span class="bigprefix">%</span>
            <input type="number" id="mPct" />
          </div>
        </div>
        <div class="pill">
          <div class="k">Margin €</div>
          <div class="biginput">
            <span class="bigprefix">€</span>
            <input type="number" id="mEur" />
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
const VAT = 1.21;
const el = id => document.getElementById(id);

const num = id => {
  const v = parseFloat(el(id).value);
  return Number.isFinite(v) ? v : null;
};

const set = (id, v) => el(id).value = v === null ? "" : Math.floor(v);

let last = null;

function sync(a,b,m){
  const A=num(a), B=num(b);
  if(last===a && A!==null) set(b, A/m);
  else if(last===b && B!==null) set(a, B*m);
}

function discountSync(){
  const sell = num("sellIn");
  if(!sell) return;

  if(last==="discPct"){
    const p=num("discPct");
    if(p!==null) set("discEur", sell*(p/100));
  }

  if(last==="discEur"){
    const e=num("discEur");
    if(e!==null) set("discPct", (e/sell)*100);
  }
}

function effectiveSell(){
  const sell=num("sellIn");
  if(!sell) return null;

  const p=num("discPct");
  const e=num("discEur");

  if(p!==null) return sell*(1-p/100);
  if(e!==null) return sell-e;

  return sell;
}

function margin(){
  const buy=num("purchaseEx");
  const sell=effectiveSell();
  if(!buy||!sell) return;

  const net=sell/VAT;
  const profit=net-buy;
  set("mEur", profit);
  set("mPct", (profit/net)*100);
}

function recalc(){
  sync("purchaseIn","purchaseEx",VAT);
  sync("sellIn","sellEx",VAT);
  discountSync();
  margin();
}

["purchaseEx","purchaseIn","sellIn","sellEx","discPct","discEur"]
.forEach(id=>{
  el(id).addEventListener("input",()=>{
    last=id;
    recalc();
  });
});
</script>

</body>
</html>
